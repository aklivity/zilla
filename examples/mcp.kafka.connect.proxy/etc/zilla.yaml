---
name: example
guards:
  authn_jwt:
    type: jwt
    options:
      issuer: https://auth.example.com
      audience: https://api.example.com
      keys:
        - kty: RSA
          n: 
          e: AQAB
          alg: RS256
          kid: example
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 7114
    routes:
      - when:
          - port: 7114
        exit: north_http_server
  north_http_server:
    type: http
    kind: server
    options:
      access-control:
        policy: cross-origin
    routes:
      - when:
          - headers:
              :scheme: http
              :path: /mcp
        exit: north_mcp_server
  north_mcp_server:
    type: mcp
    kind: server
    options:
      authorization:
        authn_jwt:
          credentials: "Bearer {credentials}"
    exit: north_mcp_proxy
  north_mcp_proxy:
    type: mcp
    kind: proxy
    routes:
      - exit: south_mcp_kafka_connect_client
        when:
          - toolkit: kafka_connect
        guarded:
          authn_jwt:
            - kafka_connect:tools
  south_mcp_kafka_connect_client:
    type: mcp-kafka-connect
    kind: client
    options:
      server: http://kafka-connect:8083
    # Routes match in declaration order, so the admin route must precede the
    # catch-all or its guard would never apply.
    routes:
      - when:
          - tool: create_connector
          - tool: delete_connector
          - tool: update_connector_config
          - tool: restart_connector
          - tool: pause_connector
          - tool: resume_connector
          - tool: stop_connector
          - tool: restart_connector_task
          - tool: alter_connector_offsets
          - tool: reset_connector_offsets
        guarded:
          authn_jwt:
            - kafka_connect:admin
      - when:
          - tool: "*"
