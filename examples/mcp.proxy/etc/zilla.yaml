---
name: example
stores:
  cache:
    type: memory
guards:
  authn_jwt:
    type: jwt
    options:
      issuer: https://auth.example.com
      audience: https://api.example.com
      keys:
        - kty: RSA
          n: 
          e: AQAB
          alg: RS256
          kid: example
catalogs:
  github_catalog:
    type: inline
    options:
      subjects:
        create_pr_params:
          version: latest
          schema: |
            {
              "type": "object",
              "required": [ "owner", "repo", "title", "head", "base" ],
              "properties": {
                "owner": { "type": "string" },
                "repo": { "type": "string" },
                "title": { "type": "string" },
                "head": { "type": "string" },
                "base": { "type": "string" },
                "body": { "type": "string" }
              }
            }
        create_pr_body:
          version: latest
          schema: |
            {
              "type": "object",
              "required": [ "title", "head", "base" ],
              "properties": {
                "title": { "type": "string" },
                "head": { "type": "string" },
                "base": { "type": "string" },
                "body": { "type": "string" }
              }
            }
        create_pr_result:
          version: latest
          schema: |
            {
              "type": "object",
              "properties": {
                "number": { "type": "integer" },
                "html_url": { "type": "string" },
                "state": { "type": "string" },
                "title": { "type": "string" }
              }
            }
        pull_result:
          version: latest
          schema: |
            {
              "type": "object",
              "properties": {
                "number": { "type": "integer" },
                "html_url": { "type": "string" },
                "state": { "type": "string" },
                "title": { "type": "string" }
              }
            }
  petstore_catalog:
    type: inline
    options:
      subjects:
        create_pet_input:
          version: latest
          schema: |
            {
              "type": "object",
              "required": [ "name" ],
              "properties": {
                "name": { "type": "string" },
                "tag": { "type": "string" }
              }
            }
        create_pet_output:
          version: latest
          schema: |
            {
              "type": "object",
              "properties": {
                "id": { "type": "integer" },
                "name": { "type": "string" },
                "tag": { "type": "string" }
              }
            }
        search_pets_input:
          version: latest
          schema: |
            {
              "type": "object",
              "properties": {
                "category": { "type": "string" }
              }
            }
        petstore:
          version: latest
          schema: |
            {
              "openapi": "3.1.0",
              "info": { "title": "Petstore", "version": "1.0.0" },
              "servers": [ { "url": "https://api.petstore.example.com" } ],
              "components": {
                "securitySchemes": {
                  "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "jwt" }
                }
              },
              "paths": {
                "/pets": {
                  "get": {
                    "operationId": "list_pets",
                    "summary": "List pets in the store",
                    "responses": {
                      "200": {
                        "description": "ok",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "id": { "type": "integer" },
                                  "name": { "type": "string" },
                                  "tag": { "type": "string" }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  },
                  "post": {
                    "operationId": "create_pet",
                    "summary": "Add a new pet to the store",
                    "security": [ { "bearerAuth": [ "pets:write" ] } ],
                    "requestBody": {
                      "required": true,
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [ "name" ],
                            "properties": {
                              "name": { "type": "string" },
                              "tag": { "type": "string" }
                            }
                          }
                        }
                      }
                    },
                    "responses": {
                      "201": {
                        "description": "created",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "properties": {
                                "id": { "type": "integer" },
                                "name": { "type": "string" },
                                "tag": { "type": "string" }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "/pets/featured": {
                  "get": {
                    "operationId": "list_featured_pets",
                    "summary": "List featured pets, hand-picked by the store",
                    "responses": {
                      "200": {
                        "description": "ok",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "id": { "type": "integer" },
                                  "name": { "type": "string" },
                                  "tag": { "type": "string" }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "/pets/{petId}": {
                  "get": {
                    "operationId": "get_pet",
                    "summary": "Get a pet by identifier",
                    "parameters": [
                      { "name": "petId", "in": "path", "required": true, "schema": { "type": "string" } }
                    ],
                    "responses": {
                      "200": {
                        "description": "ok",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "properties": {
                                "id": { "type": "integer" },
                                "name": { "type": "string" },
                                "tag": { "type": "string" }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "/pets/search": {
                  "get": {
                    "operationId": "search_pets",
                    "summary": "Search pets by tag",
                    "parameters": [
                      { "name": "tag", "in": "query", "required": false, "schema": { "type": "string" } }
                    ],
                    "responses": {
                      "200": {
                        "description": "ok",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "id": { "type": "integer" },
                                  "name": { "type": "string" },
                                  "tag": { "type": "string" }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 7114
    routes:
      - when:
          - port: 7114
        exit: north_http_server
  north_http_server:
    type: http
    kind: server
    options:
      access-control:
        policy: cross-origin
    routes:
      - when:
          - headers:
              :scheme: http
              :path: /mcp
        exit: north_mcp_server
  north_mcp_server:
    type: mcp
    kind: server
    options:
      authorization:
        authn_jwt:
          credentials: "Bearer {credentials}"
    exit: north_mcp_proxy
    telemetry:
      metrics:
        - mcp.*
      attributes:
        method: ${mcp.method}
        tool: ${mcp.tool}
        outcome: ${mcp.outcome}
  north_mcp_proxy:
    type: mcp
    kind: proxy
    options:
      cache:
        store: cache
        ttl: PT5M
        # warms the cache for every guarded toolkit route below, independent of
        # any real caller's own token -- tools/list is served from this cache
        # and filtered per caller by each tool's own security scheme (see
        # "Toolkit access vs per-tool access" in the README), so hydration
        # needs a credential broad enough to see everything once, up front,
        # not to grant any real caller access. Every guarded route below falls
        # back to this same shared credential for its own hydration south
        # connection unless it configures its own routes[].with.cache.credentials
        # override, so one broad credential is enough here. This is the raw
        # JWT, not a "Bearer "-prefixed header value -- it's handed directly to
        # guard.reauthorize(), not extracted from a header. Its scope claim must
        # include every guarded toolkit route's own toolkit-level scope below --
        # a toolkit added without updating this credential silently never
        # hydrates: the guard rejects the hydration stream, tools/list never
        # shows it (not even as a cold/searchable tool), yet tools/call still
        # works fine since real calls use the caller's own JWT, not this one
        authorization:
          authn_jwt:
            credentials: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6ImV4YW1wbGUifQ.eyJhdWQiOiJodHRwczovL2FwaS5leGFtcGxlLmNvbSIsImV4cCI6NDkzODM1MDk3OSwiaXNzIjoiaHR0cHM6Ly9hdXRoLmV4YW1wbGUuY29tIiwic2NvcGUiOiJnaXRodWI6dG9vbHMgcGV0c3RvcmU6dG9vbHMgdXJsZWxpY2l0OmF1dGhvcml6ZSBrYWZrYTp0b29scyBrYWZrYV9zcjp0b29scyBrYWZrYV9jb25uZWN0OnRvb2xzIn0.e5n0XM_a0wb1BYhJiWXvPnSXaWOJyYbAj_1e3dMdNOVFBwmWv5BwHm-LYdf7DbbJk5u09I0MtgBqVnLsntwrnxcNIPzsKSs2U17Yb6NnPz6K41TljV9HCP4nAR6KK7Lt7uwJbpuSz-yY91FqjDQFjGuOGv79oPygMaomyzz4NchnAECUysrvlYlFun-X4klQsMr3h5ik-M5hDJ5rHjkefBFBR1JZOKvJEQpgSQ9Z2i4x9KiLTV4V-UfUmYrLwFuQaHalU20Rmkl8sEJ8L16PU5tuXRnUGdLyg68_i_BV-Wc0PuAHMYIWxERIfoCBrPDrVpeK1zlNYZ4lWfgbN_onLA"
        # a fixed handful of frequently used tools stay eagerly listed; every other
        # tool across every toolkit (the "everything" reference server's dozen-plus
        # demo tools, most visibly) is omitted from tools/list -- because the search
        # tool below exists, "omitted" means discoverable by keyword, not gone: a
        # cold tool remains directly callable by name, exactly like an eager one
        tools:
          eager:
            policy: explicit
            match:
              - everything__echo
              - urlelicit__authorize
              - github__create_pr
              - petstore__list_pets
              - petstore__search_pets
              - petstore__create_pet
              - kafka_sr__list_subjects
              - kafka_sr__register_schema
              - kafka__produce
              - kafka__consume
              - kafka__create_topics
              - kafka__delete_topics
              - kafka__describe_configs
              - kafka__alter_configs
              - kafka__list_acls
              - kafka__create_acls
              - kafka__delete_acls
              - kafka__list_topics
              - kafka__describe_topic
              - kafka__cluster_overview
              - kafka__list_brokers
              - kafka__describe_cluster
              - kafka__list_consumer_groups
              - kafka__describe_consumer_group
              - kafka__describe_consumer_group_lag
              - kafka__reset_offsets
              - kafka_connect__list_connector_plugins
              - kafka_connect__list_connectors
              - kafka_connect__describe_connector
              - kafka_connect__create_connector
              - kafka_connect__delete_connector
          search:
            toolkit: zilla
    routes:
      - exit: south_mcp_client_everything
        when:
          - toolkit: everything
      - exit: south_mcp_client_urlelicit
        when:
          - toolkit: urlelicit
            tool: ["*"]
        guarded:
          authn_jwt:
            - urlelicit:authorize
      - exit: south_mcp_http_github
        when:
          - toolkit: github
        guarded:
          authn_jwt:
            - github:tools
      - exit: south_mcp_openapi_petstore
        when:
          - toolkit: petstore
        guarded:
          authn_jwt:
            - petstore:tools
      - exit: south_mcp_schema_registry_client
        when:
          - toolkit: kafka_sr
        guarded:
          authn_jwt:
            - kafka_sr:tools
      - exit: south_mcp_kafka_connect_client
        when:
          - toolkit: kafka_connect
        guarded:
          authn_jwt:
            - kafka_connect:tools
      - exit: south_mcp_kafka_client
        when:
          - toolkit: kafka
        guarded:
          authn_jwt:
            - kafka:tools
  south_mcp_client_everything:
    type: mcp
    kind: client
    options:
      server: http://everything:3001/mcp
    exit: sys:http_client
  south_mcp_client_urlelicit:
    type: mcp
    kind: client
    options:
      server: http://urlelicit:3003/mcp
      # forwards this session's own JWT upstream: authn_jwt.credentials(authorization)
      # returns the original bearer token that was validated for this session, so
      # urlelicit sees exactly the caller's own token, not a separate service credential
      authorization:
        authn_jwt:
          credentials: "Bearer {credentials}"
    exit: sys:http_client
  south_mcp_http_github:
    type: mcp-http
    kind: proxy
    options:
      authorization:
        authn_jwt:
          credentials:
            headers:
              authorization: "Bearer {credentials}"
              x-user-identity: "{identity}"
      tools:
        create_pr:
          description: Create a pull request to merge one branch into another.
          summary: "Created pull request #${result.number}: ${result.title}"
          schemas:
            input:
              model: json
              catalog:
                github_catalog:
                  - subject: create_pr_params
                    version: latest
            output:
              model: json
              catalog:
                github_catalog:
                  - subject: create_pr_result
                    version: latest
      resources:
        pull_by_number:
          # {owner}/{repo}/{number} makes this a resource TEMPLATE, listed under
          # resources/templates/list instead of resources/list -- purely from
          # the presence of {...} in the uri, no separate flag to set
          uri: "pr://{owner}/{repo}/{number}"
          description: A pull request by owner, repo, and number.
          mimeType: application/json
          schemas:
            output:
              model: json
              catalog:
                github_catalog:
                  - subject: pull_result
                    version: latest
    routes:
      # base route with no `when` applies its guard to every tool in this
      # binding, layered underneath any tool-specific guard below
      - guarded:
          authn_jwt: []
      - when:
          - tool: create_pr
        exit: south_http_client_ghapi
        guarded:
          authn_jwt:
            - github:pr:write
        with:
          headers:
            ":method": POST
            ":scheme": http
            ":authority": ghapi:4001
            ":path": /repos/${args.owner}/${args.repo}/pulls
          # owner/repo are already consumed above by the :path template, so
          # the body schema below omits them -- everything else in the
          # tools/call arguments still forwards as the request body
          body:
            model: json
            catalog:
              github_catalog:
                - subject: create_pr_body
                  version: latest
      # read-only, so (unlike create_pr) no scope beyond the base route's
      # authn_jwt is required -- captured path params surface as ${params.x},
      # never ${args.x} (that accessor is tool-call-only)
      - when:
          - resource: pull_by_number
        exit: south_http_client_ghapi
        with:
          headers:
            ":method": GET
            ":scheme": http
            ":authority": ghapi:4001
            ":path": /repos/${params.owner}/${params.repo}/pulls/${params.number}
  south_http_client_ghapi:
    type: http
    kind: client
    exit: south_tcp_client_ghapi
  south_tcp_client_ghapi:
    type: tcp
    kind: client
    options:
      host: ghapi
      port: 4001
  south_mcp_openapi_petstore:
    type: mcp-openapi
    kind: client
    options:
      specs:
        petstore:
          catalog:
            petstore_catalog:
              subject: petstore
              version: latest
          # the OpenAPI document declares the public https://api.petstore.example.com
          # server; this overrides the actual outbound target to the local mock
          server: http://petstore:4002
          security:
            bearerAuth: authn_jwt
      tools:
        list_pets:
          description: List pets in the store.
        search_pets:
          description: Search pets by category.
          # the OpenAPI query param is named "tag"; this schema renames the
          # argument callers see to "category" -- with.params on the route
          # below reconciles the two
          input:
            model: json
            catalog:
              petstore_catalog:
                - subject: search_pets_input
                  version: latest
        create_pet:
          description: Add a new pet to the store.
          summary: "Added pet: ${result.name}"
          # explicit override of the auto-derived input/output schema,
          # demonstrating the same schema-mapping mechanism as mcp-http,
          # this time optional rather than required
          input:
            model: json
            catalog:
              petstore_catalog:
                - subject: create_pet_input
                  version: latest
          output:
            model: json
            catalog:
              petstore_catalog:
                - subject: create_pet_output
                  version: latest
      resources:
        featured_pets:
          description: Featured pets, hand-picked by the store.
        pet_by_id:
          description: A single pet by identifier.
    routes:
      - when:
          - tool: list_pets
        with:
          spec: petstore
          operation: list_pets
      - when:
          - tool: create_pet
        with:
          spec: petstore
          operation: create_pet
      # the OpenAPI operation's query param is named "tag"; with.params renames
      # the tool argument callers see to "category" instead of the default args.tag
      - when:
          - tool: search_pets
        with:
          spec: petstore
          operation: search_pets
          params:
            tag: "${args.category}"
      # GET with no path params -> a static resource, listed once with a fixed URI
      - when:
          - resource: featured_pets
        with:
          spec: petstore
          operation: list_featured_pets
      # GET with a path param -> a dynamic resource template ("/pets/{petId}"),
      # listed under resources/templates and read with a concrete petId
      - when:
          - resource: pet_by_id
        with:
          spec: petstore
          operation: get_pet
  south_mcp_schema_registry_client:
    type: mcp-schema-registry
    kind: client
    options:
      server: http://karapace-registry:8081
    # a second, tool-specific guard layered under the toolkit-level
    # kafka_sr:tools gate above -- the mutating register_schema route
    # additionally requires kafka_sr:write, every other (read-only)
    # tool needs only the toolkit-level scope. Order matters: routes match in
    # declaration order, so register_schema's own route must come before the
    # catch-all glob or its guard would never apply
    routes:
      - when:
          - tool: register_schema
        guarded:
          authn_jwt:
            - kafka_sr:write
      - when:
          - tool: "*"
  south_mcp_kafka_connect_client:
    type: mcp-kafka-connect
    kind: client
    options:
      server: http://kafka-connect:8083
    # a second, tool-specific guard layered under the toolkit-level
    # kafka_connect:tools gate above -- every tool that mutates connector,
    # task, or offset state additionally requires kafka_connect:admin, while
    # every read-only tool (list_connectors, describe_connector,
    # describe_connector_config, validate_connector_config,
    # describe_connector_status, list_connector_tasks,
    # describe_connector_offsets, list_connector_plugins) needs no scope
    # beyond the toolkit-level gate above, sharing the catch-all glob route.
    # Order matters: routes match in declaration order, so the admin-tier
    # route must come before the catch-all glob or its guard would never apply
    routes:
      - when:
          - tool: create_connector
          - tool: delete_connector
          - tool: update_connector_config
          - tool: restart_connector
          - tool: pause_connector
          - tool: resume_connector
          - tool: stop_connector
          - tool: restart_connector_task
          - tool: alter_connector_offsets
          - tool: reset_connector_offsets
        guarded:
          authn_jwt:
            - kafka_connect:admin
      - when:
          - tool: "*"
  south_mcp_kafka_client:
    type: mcp-kafka
    kind: client
    options:
      servers:
        - kafka.examples.dev:29092
    # tool + topics together restrict each route to an allow-list of topics
    # (exact names or *-glob patterns), not just a tool-name dispatch; a
    # produce/consume call naming any other topic has no matching route
    # and is rejected. create_topics, delete_topics, alter_configs, and
    # reset_offsets have no topics allow-list -- each identifies its target
    # (a resource name, a topics array, or a single group+topic pair) via
    # call arguments rather than a routed topic -- so all four share one
    # route, matching on tool name alone (multiple `when` entries OR
    # together); all four are equally admin-risk mutations of cluster/topic/
    # group state, so one guard covers all. describe_configs, list_acls,
    # list_topics, describe_topic, cluster_overview, list_brokers,
    # describe_cluster, list_consumer_groups, describe_consumer_group, and
    # describe_consumer_group_lag are likewise read-only, with no topic to
    # route on, so they share one unscoped route needing no scope beyond the
    # toolkit-level kafka:tools guard above. create_topics/delete_topics/
    # alter_configs/reset_offsets and produce each layer a tool-specific scope
    # under the toolkit-level kafka:tools guard above (the same layering
    # register_schema demonstrates for the kafka_sr toolkit): kafka:admin for
    # the admin-risk topic/config/offset mutations, kafka:write for writing
    # data -- consume, describe_configs, list_acls, list_topics,
    # describe_topic, cluster_overview, list_brokers, describe_cluster,
    # list_consumer_groups, describe_consumer_group, and
    # describe_consumer_group_lag need neither, only kafka:tools.
    # create_acls and delete_acls get their own dedicated kafka:acls scope
    # rather than reusing kafka:admin: KIP-1318 classifies ACL mutation as a
    # security decision in its own right (a wrongly-scoped ALLOW grant is
    # itself a security incident, distinct in kind from a topic/config/offset
    # mutation), so an operator that trusts a caller with kafka:admin does
    # not thereby also trust it to grant or revoke access for others.
    routes:
      - when:
          - tool: create_topics
          - tool: delete_topics
          - tool: alter_configs
          - tool: reset_offsets
        guarded:
          authn_jwt:
            - kafka:admin
      - when:
          - tool: create_acls
          - tool: delete_acls
        guarded:
          authn_jwt:
            - kafka:acls
      - when:
          - tool: produce
            topics: [orders]
        guarded:
          authn_jwt:
            - kafka:write
      - when:
          - tool: consume
            topics: [orders]
      # cluster/topic/group metadata tools -- read-only like consume, so no
      # tool-specific guard beyond the toolkit-level kafka:tools above; all
      # nine share one route since none of them take a topics allow-list
      # (list_topics/cluster_overview/list_brokers/describe_cluster/
      # list_consumer_groups describe the whole cluster, describe_topic,
      # describe_consumer_group, and describe_consumer_group_lag name their
      # one topic/group as a call argument, describe_configs and list_acls
      # name a resource/filter, not a route match)
      - when:
          - tool: describe_configs
          - tool: list_acls
          - tool: list_topics
          - tool: describe_topic
          - tool: cluster_overview
          - tool: list_brokers
          - tool: describe_cluster
          - tool: list_consumer_groups
          - tool: describe_consumer_group
          - tool: describe_consumer_group_lag
telemetry:
  metrics:
    - mcp.initialize
    - mcp.initialize.duration
    - mcp.tools.list
    - mcp.tools.list.duration
    - mcp.tools.call
    - mcp.tools.call.duration
    - mcp.prompts.list
    - mcp.prompts.list.duration
    - mcp.prompts.get
    - mcp.prompts.get.duration
    - mcp.resources.list
    - mcp.resources.list.duration
    - mcp.resources.read
    - mcp.resources.read.duration
  exporters:
    stdout_logs_exporter:
      type: stdout
    prometheus_exporter:
      type: prometheus
      options:
        endpoints:
          - scheme: http
            port: 7190
            path: /metrics
