name: ${NAMESPACE:-zilla-mcp-proxy}
services:
  zilla:
    image: ghcr.io/aklivity/zilla:${ZILLA_VERSION:-latest}
    restart: unless-stopped
    hostname: zilla.examples.dev
    ports:
      - 7114:7114
      - 7190:7190
    # start_interval makes `up --wait` return as soon as zilla is ready instead of
    # after one full `interval`
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
      start_interval: 250ms
      test: ["CMD", "sh", "-c", "test -f /var/run/zilla/ready"]
    environment:
      ZILLA_INCUBATOR_ENABLED: "true"
    volumes:
      - ./etc:/etc/zilla
    command: start -v -e
    depends_on:
      everything:
        condition: service_healthy

  everything:
    image: node:20-alpine
    hostname: everything
    restart: unless-stopped
    # Pinned: an unpinned "latest" has silently changed the initialize capabilities
    # between runs
    command: ["npx", "-y", "@modelcontextprotocol/server-everything@2026.7.4", "streamableHttp"]
    environment:
      PORT: "3001"
    # npm's download cache; CI restores it keyed on the pinned version above, so a
    # cold ~2-5 minute install becomes a few seconds. Gitignored.
    volumes:
      - ./.cache/npm-everything:/root/.npm
    healthcheck:
      # generous ceiling: a cold `npx -y` install has taken 5+ minutes
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s
      start_interval: 250ms
      test: ["CMD", "nc", "-z", "127.0.0.1", "3001"]

  # Run on demand: `docker compose run --rm tools-list-client`
  tools-list-client:
    image: node:20-alpine
    deploy:
      replicas: 0
    working_dir: /app
    environment:
      MCP_URL: "http://zilla:7114/mcp"
    volumes:
      - ./tools-list-client:/app
    entrypoint: ["sh", "-c", "npm install --no-audit --no-fund --silent && node client.mjs"]

  # Run on demand: `docker compose run --rm resource-subscribe-client`
  resource-subscribe-client:
    image: node:20-alpine
    deploy:
      replicas: 0
    working_dir: /app
    environment:
      MCP_URL: "http://zilla:7114/mcp"
    volumes:
      - ./resource-subscribe-client:/app
    entrypoint: ["sh", "-c", "npm install --no-audit --no-fund --silent && node client.mjs"]

  # `docker compose run --rm verify`, which .github/test.sh does. Gated by the
  # test profile so a plain `docker compose up` never starts it. The clients run
  # here as plain node processes, so npm install happens once.
  verify:
    image: node:20-alpine
    profiles: ["test"]
    working_dir: /work
    depends_on:
      zilla:
        condition: service_healthy
    volumes:
      - ./etc/test:/test:ro
      - ../.github/test-lib.sh:/test-lib.sh:ro
      - ./tools-list-client:/work/tools-list-client
      - ./resource-subscribe-client:/work/resource-subscribe-client
    environment:
      FAIL_FAST: "${FAIL_FAST:-1}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl > /dev/null
        npm install --prefix /work/tools-list-client --no-audit --no-fund --silent
        npm install --prefix /work/resource-subscribe-client --no-audit --no-fund --silent
        exec sh /test/verify.sh

networks:
  default:
    driver: bridge
