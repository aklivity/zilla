name: ${NAMESPACE:-zilla-tcp-echo-classify}
services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_VERSION:-cpu-1.9}
    restart: unless-stopped
    hostname: tei
    command:
      - --model-id=sentence-transformers/all-MiniLM-L6-v2
    volumes:
      - tei-cache:/data
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 180s
      start_interval: 500ms
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:${PRESIDIO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - 3000:3000
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]

  zilla:
    image: ghcr.io/aklivity/zilla:${ZILLA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      tei:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
    hostname: zilla.examples.dev
    ports:
      - 12345:12345
    healthcheck:
      interval: 15s
      timeout: 3s
      retries: 60
      start_period: 30s
      test: ["CMD", "sh", "-c", "test -f /var/run/zilla/ready"]
    environment:
      ZILLA_INCUBATOR_ENABLED: "true"
    volumes:
      - ./etc:/etc/zilla
    command: start -v -e

volumes:
  tei-cache:

networks:
  default:
    driver: bridge
