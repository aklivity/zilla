---
name: example
vaults:
  your_clients:
    type: filesystem
    options:
      trust:
        store: tls/kafka.truststore.jks
        type: jks
        password: ${{env.KEYSTORE_PASSWORD}}
guards:
  sasl_credentials:
    type: inline
    options:
      format: "{identity}:{credentials}"
      credentials: ${{env.SASL_USERNAME}}:${{env.SASL_PASSWORD}}
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 7114
    routes:
      - when:
          - port: 7114
        exit: north_http_server
  north_http_server:
    type: http
    kind: server
    routes:
      - when:
          - headers:
              :scheme: http
        exit: north_http_kafka_mapping
  north_http_kafka_mapping:
    type: http-kafka
    kind: proxy
    routes:
      - when:
          - path: /events
        exit: north_kafka_cache_client
        with:
          capability: produce
          topic: events
  north_kafka_cache_client:
    type: kafka
    kind: cache_client
    exit: south_kafka_cache_server
  south_kafka_cache_server:
    type: kafka
    kind: cache_server
    exit: south_kafka_client
  south_kafka_client:
    type: kafka
    kind: client
    options:
      servers:
        - ${{env.KAFKA_BOOTSTRAP_SERVER}}
      authorization:
        sasl_credentials:
          credentials:
            mechanism: scram-sha-512
            username: "{identity}"
            password: "{credentials}"
    exit: south_tls_client
  south_tls_client:
    type: tls
    kind: client
    vault: your_clients
    options:
      trust:
        - kafka
      sni:
        - kafka
      alpn:
        - h2
    exit: south_tcp_client
  south_tcp_client:
    type: tcp
    kind: client
telemetry:
  exporters:
    stdout_logs_exporter:
      type: stdout
