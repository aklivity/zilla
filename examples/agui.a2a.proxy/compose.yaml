name: ${NAMESPACE:-zilla-agui-a2a-proxy}
services:
  zilla:
    image: ghcr.io/aklivity/zilla:${ZILLA_VERSION:-latest}
    restart: unless-stopped
    hostname: zilla.examples.dev
    ports:
      - 7117:7117
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
      start_interval: 250ms
      test: ["CMD", "sh", "-c", "test -f /var/run/zilla/ready"]
    environment:
      ZILLA_INCUBATOR_ENABLED: "true"
    volumes:
      - ./etc:/etc/zilla
    command: start -v -e
    depends_on:
      agent:
        condition: service_healthy

  agent:
    image: node:20-alpine
    hostname: agent
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PORT: "8080"
      AGENT_SLUG: assistant
    volumes:
      - ./agent:/app:ro
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
      start_interval: 250ms
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]

networks:
  default:
    driver: bridge
