---
name: example
guards:
  authn_jwt:
    type: jwt
    options:
      issuer: https://auth.example.com
      audience: https://api.example.com
      keys:
        - kty: RSA
          n: 
          e: AQAB
          alg: RS256
          kid: example
catalogs:
  inventory_catalog:
    type: filesystem
    options:
      subjects:
        inventory:
          path: protos/inventory.proto
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 7114
    routes:
      - when:
          - port: 7114
        exit: north_http_server
  north_http_server:
    type: http
    kind: server
    options:
      access-control:
        policy: cross-origin
    routes:
      - when:
          - headers:
              :scheme: http
              :path: /mcp
        exit: north_mcp_server
  north_mcp_server:
    type: mcp
    kind: server
    options:
      authorization:
        authn_jwt:
          credentials: "Bearer {credentials}"
    exit: north_mcp_proxy
    telemetry:
      metrics:
        - mcp.*
      attributes:
        method: ${mcp.method}
        tool: ${mcp.tool}
        outcome: ${mcp.outcome}
  north_mcp_proxy:
    type: mcp
    kind: proxy
    routes:
      - exit: south_mcp_grpc_inventory
        when:
          - toolkit: inventory
        guarded:
          authn_jwt:
            - inventory:tools
  south_mcp_grpc_inventory:
    type: mcp-grpc
    kind: client
    options:
      server: http://inventory:4004
      catalog:
        inventory_catalog:
          subject: inventory
          version: latest
      authorization:
        authn_jwt:
          credentials:
            headers:
              authorization: "Bearer {credentials}"
              x-user-identity: "{identity}"
      tools:
        get_item:
          title: Get inventory item
          description: Look up a single inventory item by SKU.
          annotations:
            readOnlyHint: true
        list_items:
          title: List inventory items
          description: List inventory items, optionally filtered by category.
          annotations:
            readOnlyHint: true
    routes:
      - when:
          - tool: get_item
        with:
          method: acme.inventory.v1.InventoryService/GetItem
      - when:
          - tool: list_items
        with:
          method: acme.inventory.v1.InventoryService/ListItems
  south_http_client_inventory:
    type: http
    kind: client
    options:
      versions:
        - h2
    exit: south_tcp_client_inventory
  south_tcp_client_inventory:
    type: tcp
    kind: client
    options:
      host: inventory
      port: 4004
telemetry:
  metrics:
    - mcp.initialize
    - mcp.initialize.duration
    - mcp.tools.list
    - mcp.tools.list.duration
    - mcp.tools.call
    - mcp.tools.call.duration
  exporters:
    prometheus_exporter:
      type: prometheus
      options:
        endpoints:
          - scheme: http
            port: 7190
            path: /metrics
