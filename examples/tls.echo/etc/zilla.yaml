---
name: example
vaults:
  my_servers:
    type: filesystem
    options:
      keys:
        store: tls/localhost.p12
        type: pkcs12
        password: ${{env.KEYSTORE_PASSWORD}}
      trust:
        store: tls/client-ca.p12
        type: pkcs12
        password: ${{env.TRUSTSTORE_PASSWORD}}
guards:
  my_clients:
    type: x509
    options:
      identity: subject.cn
      roles:
        client:
          - issuer.cn: Test Client CA
            subject.cn: client-*
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port: 23456
    exit: north_tls_server
  north_tls_server:
    type: tls
    kind: server
    vault: my_servers
    options:
      keys:
        - localhost
      trust:
        - client-ca
        - other-ca
      mutual: requested
      sni:
        - localhost
      alpn:
        - echo
        - secure-echo
      authorization:
        my_clients:
          credentials:
            certificates: pem
    routes:
      - when:
          - alpn: secure-echo
        guarded:
          my_clients:
            - client
        exit: north_echo_server
      - when:
          - alpn: echo
        exit: north_echo_server
  north_echo_server:
    type: echo
    kind: server
telemetry:
  exporters:
    stdout_logs_exporter:
      type: stdout
