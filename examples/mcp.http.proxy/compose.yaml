name: ${NAMESPACE:-zilla-mcp-http-proxy}
services:
  zilla:
    image: ghcr.io/aklivity/zilla:${ZILLA_VERSION:-latest}
    restart: unless-stopped
    hostname: zilla.examples.dev
    ports:
      - 7114:7114
      - 7190:7190
    # start_interval makes `up --wait` return as soon as /var/run/zilla/ready
    # exists instead of waiting out a full `interval` for the first probe
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
      start_interval: 250ms
      test: ["CMD", "sh", "-c", "test -f /var/run/zilla/ready"]
    environment:
      ZILLA_INCUBATOR_ENABLED: "true"
    volumes:
      - ./etc:/etc/zilla
    command: start -v -e
    depends_on:
      ghapi:
        condition: service_healthy

  # Mock GitHub REST API backing the mcp-http "github" toolkit.
  ghapi:
    image: node:20-alpine
    hostname: ghapi
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && node server.mjs"]
    environment:
      PORT: "4001"
    volumes:
      - ./ghapi:/app
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 250ms
      test: ["CMD", "nc", "-z", "127.0.0.1", "4001"]

  # Run on demand: `docker compose run --rm -e JWT_SCOPE="github:tools" client`.
  client:
    image: node:20-alpine
    deploy:
      replicas: 0
    working_dir: /app
    environment:
      MCP_URL: "http://zilla:7114/mcp"
    volumes:
      - ./client:/app
      - ./private.pem:/private.pem:ro
    entrypoint: ["sh", "-c", "npm install --no-audit --no-fund --silent && node client.mjs"]

  # One-off verification container -- `docker compose run --rm verify`, which is
  # all .github/test.sh does. profiles gates it out of the default set, so a
  # plain `docker compose up` never starts it. Depending on zilla's health is
  # enough to gate the whole topology, since zilla already depends on ghapi.
  verify:
    image: node:20-alpine
    profiles: ["test"]
    working_dir: /work
    depends_on:
      zilla:
        condition: service_healthy
    volumes:
      - ./etc/test:/test:ro
      - ../.github/test-lib.sh:/test-lib.sh:ro
      - ./client:/work/client
      - ./private.pem:/private.pem:ro
    environment:
      FAIL_FAST: "${FAIL_FAST:-1}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        npm install --prefix /work/client --no-audit --no-fund --silent
        exec sh /test/verify.sh

networks:
  default:
    driver: bridge
