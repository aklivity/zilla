---
name: example
guards:
  authn_jwt:
    type: jwt
    options:
      issuer: https://auth.example.com
      audience: https://api.example.com
      keys:
        - kty: RSA
          n: 
          e: AQAB
          alg: RS256
          kid: example
catalogs:
  petstore_catalog:
    type: inline
    options:
      subjects:
        create_pet_input:
          version: latest
          schema: |
            {
              "type": "object",
              "required": [ "name" ],
              "properties": {
                "name": { "type": "string" },
                "tag": { "type": "string" }
              }
            }
        create_pet_output:
          version: latest
          schema: |
            {
              "type": "object",
              "properties": {
                "id": { "type": "integer" },
                "name": { "type": "string" },
                "tag": { "type": "string" }
              }
            }
        search_pets_input:
          version: latest
          schema: |
            {
              "type": "object",
              "properties": {
                "category": { "type": "string" }
              }
            }
        petstore:
          version: latest
          schema: |
            {
              "openapi": "3.1.0",
              "info": { "title": "Petstore", "version": "1.0.0" },
              "servers": [ { "url": "https://api.petstore.example.com" } ],
              "components": {
                "securitySchemes": {
                  "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "jwt" }
                }
              },
              "paths": {
                "/pets": {
                  "get": {
                    "operationId": "list_pets",
                    "summary": "List pets in the store",
                    "responses": {
                      "200": {
                        "description": "ok",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "id": { "type": "integer" },
                                  "name": { "type": "string" },
                                  "tag": { "type": "string" }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  },
                  "post": {
                    "operationId": "create_pet",
                    "summary": "Add a new pet to the store",
                    "security": [ { "bearerAuth": [ "pets:write" ] } ],
                    "requestBody": {
                      "required": true,
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [ "name" ],
                            "properties": {
                              "name": { "type": "string" },
                              "tag": { "type": "string" }
                            }
                          }
                        }
                      }
                    },
                    "responses": {
                      "201": {
                        "description": "created",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "properties": {
                                "id": { "type": "integer" },
                                "name": { "type": "string" },
                                "tag": { "type": "string" }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "/pets/featured": {
                  "get": {
                    "operationId": "list_featured_pets",
                    "summary": "List featured pets, hand-picked by the store",
                    "responses": {
                      "200": {
                        "description": "ok",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "id": { "type": "integer" },
                                  "name": { "type": "string" },
                                  "tag": { "type": "string" }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "/pets/{petId}": {
                  "get": {
                    "operationId": "get_pet",
                    "summary": "Get a pet by identifier",
                    "parameters": [
                      { "name": "petId", "in": "path", "required": true, "schema": { "type": "string" } }
                    ],
                    "responses": {
                      "200": {
                        "description": "ok",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "properties": {
                                "id": { "type": "integer" },
                                "name": { "type": "string" },
                                "tag": { "type": "string" }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "/pets/search": {
                  "get": {
                    "operationId": "search_pets",
                    "summary": "Search pets by tag",
                    "parameters": [
                      { "name": "tag", "in": "query", "required": false, "schema": { "type": "string" } }
                    ],
                    "responses": {
                      "200": {
                        "description": "ok",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "id": { "type": "integer" },
                                  "name": { "type": "string" },
                                  "tag": { "type": "string" }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 7114
    routes:
      - when:
          - port: 7114
        exit: north_http_server
  north_http_server:
    type: http
    kind: server
    options:
      access-control:
        policy: cross-origin
    routes:
      - when:
          - headers:
              :scheme: http
              :path: /mcp
        exit: north_mcp_server
  north_mcp_server:
    type: mcp
    kind: server
    options:
      authorization:
        authn_jwt:
          credentials: "Bearer {credentials}"
    exit: north_mcp_proxy
  north_mcp_proxy:
    type: mcp
    kind: proxy
    routes:
      - exit: south_mcp_openapi_petstore
        when:
          - toolkit: petstore
        guarded:
          authn_jwt:
            - petstore:tools
  south_mcp_openapi_petstore:
    type: mcp-openapi
    kind: client
    options:
      specs:
        petstore:
          catalog:
            petstore_catalog:
              subject: petstore
              version: latest
          # the OpenAPI document declares the public https://api.petstore.example.com
          # server; this overrides the actual outbound target to the local mock
          server: http://petstore:4002
          # the document's bearerAuth scheme is enforced by the authn_jwt guard:
          # create_pet declares scope pets:write, so only callers holding it may call it
          security:
            bearerAuth: authn_jwt
      tools:
        list_pets:
          description: List pets in the store.
        search_pets:
          description: Search pets by category.
          # the OpenAPI query param is named "tag"; this schema renames the
          # argument callers see to "category" -- with.params on the route
          # below reconciles the two
          input:
            model: json
            catalog:
              petstore_catalog:
                - subject: search_pets_input
                  version: latest
        create_pet:
          description: Add a new pet to the store.
          summary: "Added pet: ${result.name}"
          # optional override of the input/output schemas otherwise derived
          # from the OpenAPI document
          input:
            model: json
            catalog:
              petstore_catalog:
                - subject: create_pet_input
                  version: latest
          output:
            model: json
            catalog:
              petstore_catalog:
                - subject: create_pet_output
                  version: latest
      resources:
        featured_pets:
          description: Featured pets, hand-picked by the store.
        pet_by_id:
          description: A single pet by identifier.
    routes:
      - when:
          - tool: list_pets
        with:
          spec: petstore
          operation: list_pets
      - when:
          - tool: create_pet
        with:
          spec: petstore
          operation: create_pet
      # the OpenAPI operation's query param is named "tag"; with.params renames
      # the tool argument callers see to "category" instead of the default args.tag
      - when:
          - tool: search_pets
        with:
          spec: petstore
          operation: search_pets
          params:
            tag: "${args.category}"
      # GET with no path params -> a static resource, listed once with a fixed URI
      - when:
          - resource: featured_pets
        with:
          spec: petstore
          operation: list_featured_pets
      # GET with a path param -> a dynamic resource template ("/pets/{petId}"),
      # listed under resources/templates and read with a concrete petId
      - when:
          - resource: pet_by_id
        with:
          spec: petstore
          operation: get_pet
