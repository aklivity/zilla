---
name: example
guards:
  authn_jwt:
    type: jwt
    options:
      issuer: https://auth.example.com
      audience: https://api.example.com
      keys:
        - kty: RSA
          n: 
          e: AQAB
          alg: RS256
          kid: example
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 7114
    routes:
      - when:
          - port: 7114
        exit: north_http_server
  north_http_server:
    type: http
    kind: server
    options:
      access-control:
        policy: cross-origin
    routes:
      - when:
          - headers:
              :scheme: http
              :path: /mcp
        exit: north_mcp_server
  north_mcp_server:
    type: mcp
    kind: server
    options:
      authorization:
        authn_jwt:
          credentials: "Bearer {credentials}"
    exit: north_mcp_proxy
  north_mcp_proxy:
    type: mcp
    kind: proxy
    routes:
      - exit: south_mcp_kafka_client
        when:
          - toolkit: kafka
        guarded:
          authn_jwt:
            - kafka:tools
      - exit: south_mcp_schema_registry_client
        when:
          - toolkit: kafka_sr
        guarded:
          authn_jwt:
            - kafka_sr:tools
  south_mcp_kafka_client:
    type: mcp-kafka
    kind: client
    options:
      servers:
        - kafka.examples.dev:29092
    # Routes match in declaration order and layer a tool-level scope under the
    # toolkit-level kafka:tools guard above. `topics` turns a route into a topic
    # allow-list: produce_message and consume_messages naming any other topic match
    # no route and are rejected. Tools that name their target in call arguments
    # rather than a routed topic (topic/config/offset mutation) share one admin route.
    routes:
      - when:
          - tool: create_topics
          - tool: delete_topics
          - tool: alter_topic_configs
          - tool: alter_broker_configs
          - tool: reset_offsets
        guarded:
          authn_jwt:
            - kafka:admin
      # ACL mutation is a security decision in its own right, so it has its own scope
      # rather than riding on kafka:admin
      - when:
          - tool: create_acls
          - tool: delete_acls
        guarded:
          authn_jwt:
            - kafka:acls
      - when:
          - tool: produce_message
            topics: [orders]
        guarded:
          authn_jwt:
            - kafka:write
      - when:
          - tool: consume_messages
            topics: [orders]
      - when:
          - tool: describe_topic_configs
          - tool: describe_broker_configs
          - tool: list_acls
          - tool: list_topics
          - tool: describe_topic
          - tool: cluster_overview
          - tool: list_brokers
          - tool: describe_cluster
          - tool: list_consumer_groups
          - tool: describe_consumer_group
          - tool: describe_consumer_group_lag
  south_mcp_schema_registry_client:
    type: mcp-schema-registry
    kind: client
    options:
      server: http://karapace-registry:8081
    routes:
      - when:
          - tool: register_schema
        guarded:
          authn_jwt:
            - kafka_sr:write
      - when:
          - tool: "*"
