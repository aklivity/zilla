---
name: example
telemetry:
  metrics:
    - llm.tokens.input
    - llm.tokens.output
    - llm.tokens.total
    - llm.tokens.cache.read
    - llm.tokens.cache.write
    - llm.tokens.reasoning
    - llm.duration
    - llm.active.requests
    - llm.interactions
    - llm.time.to.first.token
    - llm.usage.incomplete
  exporters:
    prometheus_exporter:
      type: prometheus
      options:
        endpoints:
          - scheme: http
            port: 7190
            path: /metrics
guards:
  api_key:
    type: inline
bindings:
  north_tcp_server_openai:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port: 7161
    exit: north_http_server_openai
  north_http_server_openai:
    type: http
    kind: server
    exit: north_llm_server_openai
  north_llm_server_openai:
    type: llm
    kind: server
    options:
      dialect: openai
      authorization:
        api_key:
          credentials: "Bearer {credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: north_llm_proxy

  north_tcp_server_anthropic:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port: 7162
    exit: north_http_server_anthropic
  north_http_server_anthropic:
    type: http
    kind: server
    exit: north_llm_server_anthropic
  north_llm_server_anthropic:
    type: llm
    kind: server
    options:
      dialect: anthropic
      authorization:
        api_key:
          credentials: "{credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: north_llm_proxy

  # Shared by both frontends: routes purely on LlmBeginEx.dialect/model, never on
  # request content. The model names the backend, so a request reaches the
  # provider that serves its model whichever dialect the client speaks: a
  # claude-* model reaches Anthropic and a gpt-* model reaches OpenAI. A client
  # speaking the other dialect is translated across dialects on the way (an
  # OpenAI SDK client asking for a Claude model, an Anthropic SDK client asking
  # for a GPT model), and a client already speaking the backend's dialect is
  # not. Two specific models are picked off first and sent, same-dialect, to a
  # second deployment instead -- the intra-dialect failover/multi-backend
  # routing this binding kind exists for. Any other model is served by the
  # provider of the client's own dialect, with no translation. The claude-*
  # route lists a fallback model: when its exit resets the stream before
  # sending a window, such as when the upstream server cannot be reached, the
  # request is retried with that model, routed like any other request for it.
  north_llm_proxy:
    type: llm
    kind: proxy
    options:
      guardrails:
        gpt-4o:
          request:
            - section: user-text
              value:
                model: string
                pattern: "(?s)(?!.*ignore previous instructions).*"
    telemetry:
      metrics:
        - llm.*
    routes:
      - when:
          - dialect: openai
            model: [ gpt-4o ]
        exit: south_llm_client_openai_secondary
      - when:
          - dialect: anthropic
            model: [ claude-3-5-haiku-20241022 ]
        exit: south_llm_client_anthropic_secondary
      - when:
          - model: [ "claude-*" ]
        exit: south_llm_client_anthropic
        with:
          fallback: [ claude-3-5-haiku-20241022 ]
      - when:
          - model: [ "gpt-*" ]
        exit: south_llm_client_openai
      - when:
          - dialect: openai
        exit: south_llm_client_openai
      - when:
          - dialect: anthropic
        exit: south_llm_client_anthropic

  # Every south_llm_client_* below targets the real OpenAI/Anthropic API
  # directly over TLS -- see README.md's "Credential pass-through" section:
  # options.authorization templates the *caller's own* credential rather than
  # configuring one of Zilla's own, so no API key is ever written here. The
  # secondary deployments point at the same real API as their primary -- this
  # example has only one real backend per dialect to demonstrate the
  # model-based routing against, unlike CI's mocks, which use a distinct
  # secondary instance specifically to prove which backend answered (see
  # .github/zilla.yaml).
  south_llm_client_anthropic:
    type: llm
    kind: client
    options:
      dialect: anthropic
      server: https://api.anthropic.com:443
      authorization:
        api_key:
          credentials: "{credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_anthropic
  south_http_client_anthropic:
    type: http
    kind: client
    exit: south_tls_client_anthropic
  south_tls_client_anthropic:
    type: tls
    kind: client
    vault: south_clients
    options:
      trustcacerts: true
      sni:
        - api.anthropic.com
    exit: south_tcp_client_anthropic
  south_tcp_client_anthropic:
    type: tcp
    kind: client
    options:
      host: api.anthropic.com
      port: 443

  south_llm_client_openai:
    type: llm
    kind: client
    options:
      dialect: openai
      server: https://api.openai.com:443
      authorization:
        api_key:
          credentials: "Bearer {credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_openai
  south_http_client_openai:
    type: http
    kind: client
    exit: south_tls_client_openai
  south_tls_client_openai:
    type: tls
    kind: client
    vault: south_clients
    options:
      trustcacerts: true
      sni:
        - api.openai.com
    exit: south_tcp_client_openai
  south_tcp_client_openai:
    type: tcp
    kind: client
    options:
      host: api.openai.com
      port: 443

  # Second same-dialect (openai) deployment: north_llm_proxy routes gpt-4o here
  # instead of translating to Anthropic -- no dialect translation happens on
  # this leg at all, same dialect in as out.
  south_llm_client_openai_secondary:
    type: llm
    kind: client
    options:
      dialect: openai
      server: https://api.openai.com:443
      authorization:
        api_key:
          credentials: "Bearer {credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_openai_secondary
  south_http_client_openai_secondary:
    type: http
    kind: client
    exit: south_tls_client_openai_secondary
  south_tls_client_openai_secondary:
    type: tls
    kind: client
    vault: south_clients
    options:
      trustcacerts: true
      sni:
        - api.openai.com
    exit: south_tcp_client_openai_secondary
  south_tcp_client_openai_secondary:
    type: tcp
    kind: client
    options:
      host: api.openai.com
      port: 443

  # Second same-dialect (anthropic) deployment: north_llm_proxy routes
  # claude-3-5-haiku-20241022 here instead of translating to OpenAI.
  south_llm_client_anthropic_secondary:
    type: llm
    kind: client
    options:
      dialect: anthropic
      server: https://api.anthropic.com:443
      authorization:
        api_key:
          credentials: "{credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_anthropic_secondary
  south_http_client_anthropic_secondary:
    type: http
    kind: client
    exit: south_tls_client_anthropic_secondary
  south_tls_client_anthropic_secondary:
    type: tls
    kind: client
    vault: south_clients
    options:
      trustcacerts: true
      sni:
        - api.anthropic.com
    exit: south_tcp_client_anthropic_secondary
  south_tcp_client_anthropic_secondary:
    type: tcp
    kind: client
    options:
      host: api.anthropic.com
      port: 443

vaults:
  south_clients:
    type: filesystem
    options: {}
