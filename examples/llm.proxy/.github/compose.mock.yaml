# CI-only overlay: merged in via COMPOSE_FILE in .github/.env.test. Stands up
# the five mock backends and points zilla at .github/zilla.yaml (mock
# hostnames, no TLS) instead of ../etc/zilla.yaml (the real OpenAI, Anthropic
# and Gemini APIs), so this example is verifiable without real API keys or
# network access to any provider.
#
# Relative paths here resolve against the project directory (the base
# compose.yaml's directory / CWD), not against this file's own .github/
# directory -- so this is `./.github/...`, not `./...`.
services:
  # Mock OpenAI API backing south_llm_client_openai (chat completions) and
  # south_llm_client_openai_responses (responses).
  mock-openai:
    image: node:20-alpine
    hostname: mock-openai
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && node server.mjs"]
    environment:
      PORT: "4101"
    volumes:
      - ./.github/mock-openai:/app
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 250ms
      test: ["CMD", "nc", "-z", "127.0.0.1", "4101"]

  # Mock Anthropic messages API backing south_llm_client_anthropic.
  mock-anthropic:
    image: node:20-alpine
    hostname: mock-anthropic
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && node server.mjs"]
    environment:
      PORT: "4102"
    volumes:
      - ./.github/mock-anthropic:/app
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 250ms
      test: ["CMD", "nc", "-z", "127.0.0.1", "4102"]

  # Second openai-dialect deployment backing south_llm_client_openai_secondary;
  # north_llm_proxy routes gpt-4o here instead of translating to mock-anthropic
  # -- no dialect translation happens on this leg for a chat completions request,
  # while a responses request is translated to chat completions.
  mock-openai-secondary:
    image: node:20-alpine
    hostname: mock-openai-secondary
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && node server.mjs"]
    environment:
      PORT: "4103"
    volumes:
      - ./.github/mock-openai-secondary:/app
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 250ms
      test: ["CMD", "nc", "-z", "127.0.0.1", "4103"]

  # Second anthropic-dialect deployment backing south_llm_client_anthropic_secondary;
  # north_llm_proxy routes claude-3-5-haiku-20241022 here instead of translating
  # to mock-openai.
  mock-anthropic-secondary:
    image: node:20-alpine
    hostname: mock-anthropic-secondary
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && node server.mjs"]
    environment:
      PORT: "4104"
    volumes:
      - ./.github/mock-anthropic-secondary:/app
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 250ms
      test: ["CMD", "nc", "-z", "127.0.0.1", "4104"]

  # Mock Gemini generateContent API backing south_llm_client_gemini.
  mock-gemini:
    image: node:20-alpine
    hostname: mock-gemini
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && node server.mjs"]
    environment:
      PORT: "4105"
    volumes:
      - ./.github/mock-gemini:/app
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 250ms
      test: ["CMD", "nc", "-z", "127.0.0.1", "4105"]

  # Overrides the base compose.yaml's zilla service: swaps in the mock-backed
  # config and waits on every mock's health, neither of which the real-API
  # default needs.
  zilla:
    volumes:
      - ./.github/zilla.yaml:/etc/zilla/zilla.yaml:ro
    depends_on:
      mock-openai:
        condition: service_healthy
      mock-anthropic:
        condition: service_healthy
      mock-openai-secondary:
        condition: service_healthy
      mock-anthropic-secondary:
        condition: service_healthy
      mock-gemini:
        condition: service_healthy
