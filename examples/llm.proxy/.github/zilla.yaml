---
# CI-only: identical topology to ../etc/zilla.yaml, but every south_llm_client_*
# targets a local mock instead of the real OpenAI/Anthropic API, so this example
# is verifiable without real API keys or network access to either provider.
# Loaded in place of ../etc/zilla.yaml by compose.mock.yaml (see .env.test).
name: example
telemetry:
  metrics:
    - llm.tokens.input
    - llm.tokens.output
    - llm.tokens.total
    - llm.tokens.cache.read
    - llm.tokens.cache.write
    - llm.tokens.reasoning
    - llm.duration
    - llm.active.requests
    - llm.interactions
    - llm.time.to.first.token
    - llm.usage.incomplete
  exporters:
    prometheus_exporter:
      type: prometheus
      options:
        endpoints:
          - scheme: http
            port: 7190
            path: /metrics
guards:
  api_key:
    type: inline
bindings:
  north_tcp_server_openai:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port: 7161
    exit: north_http_server_openai
  north_http_server_openai:
    type: http
    kind: server
    exit: north_llm_server_openai
  north_llm_server_openai:
    type: llm
    kind: server
    options:
      dialect: openai
      authorization:
        api_key:
          credentials: "Bearer {credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: north_llm_proxy

  north_tcp_server_anthropic:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port: 7162
    exit: north_http_server_anthropic
  north_http_server_anthropic:
    type: http
    kind: server
    exit: north_llm_server_anthropic
  north_llm_server_anthropic:
    type: llm
    kind: server
    options:
      dialect: anthropic
      authorization:
        api_key:
          credentials: "{credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: north_llm_proxy

  # Shared by both frontends: routes purely on LlmBeginEx.dialect/model, never on
  # request content. The model names the backend, so a request reaches the
  # provider that serves its model whichever dialect the client speaks: a
  # claude-* model reaches Anthropic and a gpt-* model reaches OpenAI. A client
  # speaking the other dialect is translated across dialects on the way (an
  # OpenAI SDK client asking for a Claude model, an Anthropic SDK client asking
  # for a GPT model), and a client already speaking the backend's dialect is
  # not. Two specific models are picked off first and sent, same-dialect, to a
  # second deployment instead -- the intra-dialect failover/multi-backend
  # routing this binding kind exists for. Any other model is served by the
  # provider of the client's own dialect, with no translation.
  north_llm_proxy:
    type: llm
    kind: proxy
    options:
      guardrails:
        gpt-4o:
          request:
            - section: user-text
              value:
                model: string
                pattern: "(?s)(?!.*ignore previous instructions).*"
            - section: user-text
              value:
                model: string
                maxLength: 2000
          response:
            - section: assistant-text
              value:
                model: string
                pattern: "(?s)(?!.*BEGIN PRIVATE KEY).*"
        claude-3-5-haiku-20241022:
          request:
            - section: user-text
              value:
                model: string
                maxLength: 200
    telemetry:
      metrics:
        - llm.*
    routes:
      - when:
          - dialect: openai
            model: [ gpt-4o ]
        exit: south_llm_client_openai_secondary
      - when:
          - dialect: anthropic
            model: [ claude-3-5-haiku-20241022 ]
        exit: south_llm_client_anthropic_secondary
      - when:
          - model: [ claude-unreachable ]
        exit: south_llm_client_anthropic_unreachable
        with:
          fallback: [ claude-3-5-haiku-20241022 ]
      - when:
          - model: [ "claude-*" ]
        exit: south_llm_client_anthropic
        with:
          fallback: [ claude-3-5-haiku-20241022 ]
      - when:
          - model: [ "gpt-*" ]
        exit: south_llm_client_openai
      - when:
          - dialect: openai
        exit: south_llm_client_openai
      - when:
          - dialect: anthropic
        exit: south_llm_client_anthropic

  south_llm_client_anthropic:
    type: llm
    kind: client
    options:
      dialect: anthropic
      server: http://mock-anthropic:4102
      authorization:
        api_key:
          credentials: "{credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_anthropic
  south_http_client_anthropic:
    type: http
    kind: client
    exit: south_tcp_client_anthropic
  south_tcp_client_anthropic:
    type: tcp
    kind: client
    options:
      host: mock-anthropic
      port: 4102

  # Nothing listens on this port, so the connection is refused before the llm
  # client grants any credit and north_llm_proxy falls back to the next model
  # in the claude-unreachable route, which routes to the secondary deployment.
  south_llm_client_anthropic_unreachable:
    type: llm
    kind: client
    options:
      dialect: anthropic
      server: http://mock-anthropic:4999
      authorization:
        api_key:
          credentials: "{credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_anthropic_unreachable
  south_http_client_anthropic_unreachable:
    type: http
    kind: client
    exit: south_tcp_client_anthropic_unreachable
  south_tcp_client_anthropic_unreachable:
    type: tcp
    kind: client
    options:
      host: mock-anthropic
      port: 4999

  south_llm_client_openai:
    type: llm
    kind: client
    options:
      dialect: openai
      server: http://mock-openai:4101
      authorization:
        api_key:
          credentials: "Bearer {credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_openai
  south_http_client_openai:
    type: http
    kind: client
    exit: south_tcp_client_openai
  south_tcp_client_openai:
    type: tcp
    kind: client
    options:
      host: mock-openai
      port: 4101

  # Second same-dialect (openai) deployment: north_llm_proxy routes gpt-4o here
  # instead of translating to mock-anthropic -- no dialect translation happens
  # on this leg at all, same dialect in as out.
  south_llm_client_openai_secondary:
    type: llm
    kind: client
    options:
      dialect: openai
      server: http://mock-openai-secondary:4103
      authorization:
        api_key:
          credentials: "Bearer {credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_openai_secondary
  south_http_client_openai_secondary:
    type: http
    kind: client
    exit: south_tcp_client_openai_secondary
  south_tcp_client_openai_secondary:
    type: tcp
    kind: client
    options:
      host: mock-openai-secondary
      port: 4103

  # Second same-dialect (anthropic) deployment: north_llm_proxy routes
  # claude-3-5-haiku-20241022 here instead of translating to mock-openai.
  south_llm_client_anthropic_secondary:
    type: llm
    kind: client
    options:
      dialect: anthropic
      server: http://mock-anthropic-secondary:4104
      authorization:
        api_key:
          credentials: "{credentials}"
    telemetry:
      metrics:
        - llm.*
    exit: south_http_client_anthropic_secondary
  south_http_client_anthropic_secondary:
    type: http
    kind: client
    exit: south_tcp_client_anthropic_secondary
  south_tcp_client_anthropic_secondary:
    type: tcp
    kind: client
    options:
      host: mock-anthropic-secondary
      port: 4104
