---
name: example
embeddings:
  embedding0:
    type: openai
    options:
      model: sentence-transformers/all-MiniLM-L6-v2
      endpoint: http://tei:80/v1/embeddings
      credentials:
        api-key: unused
stores:
  cache0:
    type: memory
classifiers:
  moderator0:
    type: semantic
    embedding: embedding0
    store: cache0
    options:
      threshold: 0.185
      labels:
        withholding:
          - "You will never believe what happened next."
          - "I have a massive secret but I absolutely cannot tell anyone here."
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port: 12345
    exit: north_echo_server
  north_echo_server:
    type: echo
    kind: server
    options:
      value:
        model: classify
        reject:
          moderator0:
            - withholding
telemetry:
  exporters:
    stdout_logs_exporter:
      type: stdout
