name: build

on:
  push:
    branches: [ develop, 'support/**', 'feature/**'  ]
  pull_request:
    branches: [ develop, 'support/**', 'feature/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      rebuilt-modules: ${{ steps.rebuilt.outputs.modules }}
    strategy:
      matrix:
        java: [ 25 ]

    steps:
    - name: Checkout GitHub sources
      uses: actions/checkout@v7
    - name: Pin maven.packages.aklivity.io to IPv4
      run: |
        ipv4=$(getent ahostsv4 maven.packages.aklivity.io | awk 'NR==1{print $1}')
        if [ -n "$ipv4" ]; then
          echo "$ipv4 maven.packages.aklivity.io" | sudo tee -a /etc/hosts
        fi
    - name: Setup JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/io/aklivity/zilla
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Cache Maven wrapper distribution
      uses: actions/cache@v6
      with:
        path: ~/.m2/wrapper
        key: ${{ runner.os }}-m2-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-m2-wrapper-
    - name: Cache ZPM test artifacts
      uses: actions/cache@v6
      with:
        path: manager/target/zpm/cache
        key: zpm-${{ runner.os }}-${{ hashFiles('manager/src/conf/install/zpm.json') }}
        restore-keys: zpm-${{ runner.os }}-
    - name: Restore Maven build cache
      run: |
        .github/scripts/build-cache.sh install
        PATH="$HOME/.local/bin:$PATH" .github/scripts/build-cache.sh restore ~/.m2/build-cache \
          "ghcr.io/$GITHUB_REPOSITORY/build-cache" "$BRANCH" develop
      env:
        BRANCH: ${{ github.base_ref || github.ref_name }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
    - name: Mark build start
      run: touch ~/.build-start
    - name: Route Docker Hub pulls through mirror.gcr.io
      run: |
        sudo mkdir -p /etc/docker
        if [ -f /etc/docker/daemon.json ]; then
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json > /tmp/daemon.json
        else
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json
        fi
        sudo mv /tmp/daemon.json /etc/docker/daemon.json
        sudo systemctl restart docker
        timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
    - name: Restore base image cache
      uses: actions/cache/restore@v6
      with:
        path: ~/docker-base-cache/base-images.tar
        key: docker-base-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          docker-base-${{ runner.os }}-
    - name: Load cached base images
      run: |
        if [ -f ~/docker-base-cache/base-images.tar ]; then
          docker load -i ~/docker-base-cache/base-images.tar || true
        fi
    - name: Build with Maven
      run: ./mvnw -B -nsu -ntp -Ddocker.logStdout -Dfailsafe.skipAfterFailureCount=1 -Ddocker.verbose install
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Pack Maven build cache
      if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'develop' || startsWith(github.ref_name, 'support/'))
      run: .github/scripts/build-cache.sh pack ~/.m2/build-cache "$RUNNER_TEMP/build-cache"

    - name: Upload Maven build cache
      if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'develop' || startsWith(github.ref_name, 'support/'))
      uses: actions/upload-artifact@v7
      with:
        name: build-cache
        path: ${{ runner.temp }}/build-cache/build-cache.tar.zst
        compression-level: 0
        retention-days: 1

    - name: Save base images
      if: always()
      run: |
        mkdir -p ~/docker-base-cache
        imgs=$(docker images --format '{{.Repository}}:{{.Tag}}' \
          | grep -Ev '<none>|ghcr.io/aklivity/zilla' \
          | grep -E '^(eclipse-temurin|ubuntu|alpine|ghcr\.io/aklivity/tshark):')
        if [ -n "$imgs" ]; then
          docker save -o ~/docker-base-cache/base-images.tar $imgs
        fi
    - name: Save base image cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ~/docker-base-cache/base-images.tar
        key: docker-base-${{ runner.os }}-${{ github.run_id }}

    - name: Save Docker image
      if: success()
      run: |
        mkdir -p ~/docker-cache
        docker save -o ~/docker-cache/docker.tar $(docker images --format "{{.Repository}}" | grep "zilla")

    - name: Upload Docker image
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: zilla-image
        path: ~/docker-cache/docker.tar
        retention-days: 1

    - name: List modules rebuilt by this run
      id: rebuilt
      run: |
        modules=$(find ~/.m2/build-cache -name buildinfo.xml -newer ~/.build-start \
          | awk -F/ '{print $(NF-3)}' | sort -u | paste -sd, -)
        echo "Rebuilt modules: $modules"
        echo "modules=$modules" >> "$GITHUB_OUTPUT"

    - name: Conditional Artifact Upload
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: zilla-build-${{ matrix.java }}-${{ github.event.number }}
        path: |
          **/hs_err_pid*.log
          **/target/surefire-reports/
          **/target/zilla-itests/
          **/target/failsafe-reports/

  publish-cache:
    name: Publish build cache
    if: ${{ needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'develop' || startsWith(github.ref_name, 'support/')) }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout GitHub sources
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Download Maven build cache
        uses: actions/download-artifact@v8
        with:
          name: build-cache
          path: ${{ runner.temp }}/build-cache
      - name: Publish Maven build cache
        run: |
          .github/scripts/build-cache.sh install
          PATH="$HOME/.local/bin:$PATH" .github/scripts/build-cache.sh push "$RUNNER_TEMP/build-cache" \
            "ghcr.io/$GITHUB_REPOSITORY/build-cache" "$GITHUB_REF_NAME"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}

  setup-examples:
    runs-on: ubuntu-latest
    needs:
      - build
    outputs:
      matrix_directories: ${{ steps.select.outputs.matrix_directories }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get examples dirs
        id: all-files
        uses: Drafteame/list-folders-action@main
        with:
          paths: |
            examples
          omit: |
            ^\.github$
            ^\.assets$
            ^\.git$
            ^\.vscode$
            ^tcp.reflect$
            ^ws.proxy$
            ^ws.reflect$
            ^http.echo$
            ^grpc.kafka.proxy$

      # Pull requests run the examples that changed or configure a module the build
      # rebuilt; set the repository variable EXAMPLES_SELECTION to "all" to run every example.
      - name: Test example selection
        run: python3 examples/.github/test_select_examples.py

      - name: Select examples
        id: select
        run: python3 examples/.github/select-examples.py
        env:
          ALL: ${{ steps.all-files.outputs.folders_no_base_path }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_MODULES: ${{ needs.build.outputs.rebuilt-modules }}
          MODE: ${{ vars.EXAMPLES_SELECTION }}

  cache-images:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Route Docker Hub pulls through mirror.gcr.io
        run: |
          sudo mkdir -p /etc/docker
          if [ -f /etc/docker/daemon.json ]; then
            sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json > /tmp/daemon.json
          else
            echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json
          fi
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

      - name: Compute shared example image cache key
        id: key
        run: echo "key=example-images-v2-${{ runner.os }}-${{ hashFiles('examples/**/compose.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore shared example image cache
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/docker-images-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            example-images-v2-${{ runner.os }}-

      - name: Pull missing example images and refresh shared cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p ~/docker-images-cache
          examples/.github/example-images.sh examples/*/compose.yaml > ~/images.txt
          echo "Ensuring the following example images are present:"
          cut -d' ' -f1 ~/images.txt
          while read -r image tarball; do
            if [ ! -f ~/docker-images-cache/"$tarball" ]; then
              docker pull "$image" && docker save -o ~/docker-images-cache/"$tarball" "$image" \
                || echo "::warning::failed to cache $image"
            fi
          done < ~/images.txt
          find ~/docker-images-cache -name '*.tar' | while read -r tarball; do
            grep -q " $(basename "$tarball")$" ~/images.txt || rm -f "$tarball"
          done

  testing:
    strategy:
      matrix:
        dir: ${{ fromJson(needs.setup-examples.outputs.matrix_directories) }}
      fail-fast: false
    if: ${{ needs.setup-examples.result == 'success' && needs.setup-examples.outputs.matrix_directories != '[]' }}
    needs:
      - setup-examples
      - cache-images
    runs-on: ubuntu-latest
    env:
      ZILLA_VERSION: develop-SNAPSHOT
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            examples/.github
            examples/${{ matrix.dir }}

      - name: Route Docker Hub pulls through mirror.gcr.io
        run: |
          sudo mkdir -p /etc/docker
          if [ -f /etc/docker/daemon.json ]; then
            sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json > /tmp/daemon.json
          else
            echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json
          fi
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: zilla-image
          path: ~/docker-cache

      - name: Load Docker image
        run: |
          docker load -i ~/docker-cache/docker.tar

      - name: Restore shared example image cache
        uses: actions/cache/restore@v6
        with:
          path: ~/docker-images-cache
          key: ${{ needs.cache-images.outputs.key }}

      - name: Load example images
        run: |
          examples/.github/example-images.sh examples/${{ matrix.dir }}/compose.yaml | while read -r image tarball; do
            if [ -f ~/docker-images-cache/"$tarball" ]; then
              docker load -i ~/docker-images-cache/"$tarball" || true
            fi
          done

      # mcp.proxy's "everything" toolkit is installed via a live `npx -y` at
      # container start (no baked-in image), so the cold path -- npm resolving
      # and fetching 100+ transitive packages one by one -- takes anywhere
      # from ~2 to 5+ minutes depending on npm-registry conditions, observed
      # to occasionally exceed even the healthcheck's generous 10-minute
      # ceiling under a slow registry. Restoring npm's own cache directory
      # (mounted into the container -- see compose.yaml's `everything`
      # service) turns that into a few-seconds no-op fetch instead. Bump the
      # key's version suffix if the pinned @modelcontextprotocol/server-everything
      # version in that compose.yaml ever changes.
      - name: Restore npm cache for shared MCP "everything" server
        if: ${{ matrix.dir == 'mcp.proxy' }}
        uses: actions/cache@v6
        with:
          path: examples/${{ matrix.dir }}/.cache/npm-everything
          key: npm-everything-2026.7.4-${{ runner.os }}

      - name: Start Zilla and wait for it to be healthy
        working-directory: examples/${{ matrix.dir }}
        run: docker compose up -d --wait

      - name: Execute Test
        working-directory: examples/${{ matrix.dir }}
        # Without a cap this step inherits GitHub's 6h job ceiling, and a test that
        # stalls holds a runner that whole time while serving no logs -- in-progress
        # jobs have none, so the failure is invisible until it is hours old. The cap
        # also converts a stall into failure(), which is what runs the docker log and
        # engine directory collection below; a hang collects nothing. Every example
        # except mcp.proxy finishes inside two minutes, and mcp.proxy's own bounded
        # worst case sits well under this, so 30m only ever fires on a genuine stall.
        timeout-minutes: 30
        run: |
          set -o pipefail
          ./.github/test.sh | tee $GITHUB_STEP_SUMMARY

      - name: Collect docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2
        with:
          dest: "./logs"
      # `zilla dump` reads a collected engine directory, so ship it with the logs.
      # Copied out rather than bind-mounted: a host mount over /var/run/zilla can
      # collide with the container user's ownership of it and break the example
      # itself. Lands inside ./logs, which is already tarred and uploaded below.
      - name: Collect zilla engine directory on failure
        if: failure()
        working-directory: examples/${{ matrix.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          docker compose cp zilla:/var/run/zilla "$GITHUB_WORKSPACE/logs/engine" || true

      - name: Tar logs
        if: failure()
        run: tar cvzf ./logs.tgz ./logs
      - name: Upload logs to GitHub
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dir }}_logs.tgz
          path: ./logs.tgz

      - name: Teardown
        if: ${{ always() && hashFiles(format('examples/{0}/teardown.sh', matrix.dir)) != '' }}
        working-directory: examples/${{ matrix.dir }}
        run: docker compose down --remove-orphans

  examples:
    name: Examples
    if: ${{ always() }}
    needs:
      - setup-examples
      - cache-images
      - testing
    runs-on: ubuntu-latest
    steps:
      - name: Verify examples
        env:
          SETUP: ${{ needs.setup-examples.result }}
          CACHE: ${{ needs.cache-images.result }}
          TESTING: ${{ needs.testing.result }}
        run: |
          echo "setup-examples: $SETUP, cache-images: $CACHE, testing: $TESTING"
          [ "$SETUP" = success ] && [ "$CACHE" = success ] && { [ "$TESTING" = success ] || [ "$TESTING" = skipped ]; }

  cleanup:
    if: ${{ !failure() && !cancelled() }}
    needs:
      - testing
    runs-on: ubuntu-latest
    steps:
      - name: Delete Docker image artifact
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === 'zilla-image') {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
