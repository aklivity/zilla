---
name: test
bindings:
  proxy0:
    type: llm
    kind: proxy
    routes:
    - when:
      - dialect: openai
        model: [ gpt-a ]
      exit: client0
      with:
        fallback: [ gpt-b ]
  client0:
    type: llm
    kind: client
    options:
      dialect: openai
      server: http://example.com:8080
    exit: net0
