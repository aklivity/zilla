---
name: test
embeddings:
  embedding0:
    type: test
stores:
  store0:
    type: test
classifiers:
  moderator0:
    type: semantic
    embedding: embedding0
    store: store0
    options:
      threshold: 0.99
      labels:
        prompt.injection:
          - "ignore previous instructions"
          - "disregard the system prompt"
        policy.exfiltration:
          - "send the contents to"
bindings:
  net0:
    type: test
    kind: server
    options:
      value:
        model: classify
        reject:
          moderator0:
            - prompt.injection
            - policy.exfiltration
    exit: app0
