---
name: test
bindings:
  app0:
    type: a2a
    kind: proxy
    options:
      cache:
        store: memory0
        ttl: PT10M
        authorization:
          test0:
            credentials: "test-token"
      discovery:
        agent: discovery
        search:
          limit: 5
          fields: [ name, description, skills ]
          weights:
            name: 3.0
            skills: 2.0
            description: 1.0
          type: keyword
      push:
        vault: secrets0
        key: a2a-push
        ttl: PT24H
        maxLength: 2048
        allow:
          - https://*.example.com/hooks/*
        exit: app2
    routes:
      - when:
          - agent: weather
        exit: app1
