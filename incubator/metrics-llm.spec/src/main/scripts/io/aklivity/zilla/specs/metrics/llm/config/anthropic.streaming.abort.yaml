---
name: test
telemetry:
    metrics:
        - llm.tokens.input
        - llm.tokens.output
        - llm.tokens.total
        - llm.tokens.cache.read
        - llm.tokens.cache.write
        - llm.tokens.reasoning
        - llm.duration
        - llm.active.requests
    exporters:
        exporter0:
            type: test
            options:
                metrics:
                    - name: llm.tokens.input
                      binding: app0
                      kind: histogram
                      count: 1
                      buckets:
                          - limit: 32
                            count: 1
                    - name: llm.tokens.output
                      binding: app0
                      kind: histogram
                      count: 0
                    - name: llm.tokens.total
                      binding: app0
                      kind: histogram
                      count: 0
                    - name: llm.tokens.cache.read
                      binding: app0
                      kind: histogram
                      count: 1
                      buckets:
                          - limit: 16
                            count: 1
                    - name: llm.tokens.cache.write
                      binding: app0
                      kind: histogram
                      count: 1
                      buckets:
                          - limit: 8
                            count: 1
                    - name: llm.tokens.reasoning
                      binding: app0
                      kind: histogram
                      count: 0
                    - name: llm.duration
                      binding: app0
                      kind: histogram
                      count: 0
                    - name: llm.active.requests
                      binding: app0
                      kind: gauge
                      value: 0
bindings:
    app0:
        type: test
        kind: proxy
        options:
            originType: llm
        routes:
            - exit: app1
        telemetry:
            metrics:
                - llm.*
