---
name: test
guards:
    test0:
        type: test
        options:
            identity: alice
            attributes:
                tenant: acme
telemetry:
    metrics:
        - llm.tokens.input
        - llm.tokens.output
        - llm.duration
        - llm.active.requests
        - llm.interactions
        - llm.time.to.first.token
    exporters:
        exporter0:
            type: test
            options:
                metrics:
                    - name: llm.tokens.input
                      binding: app0
                      kind: histogram
                      attributes:
                          status: "200"
                          tenant: "acme"
                          user: "alice"
                      count: 1
                    - name: llm.tokens.output
                      binding: app0
                      kind: histogram
                      attributes:
                          status: "200"
                          tenant: "acme"
                          user: "alice"
                      count: 1
                    - name: llm.duration
                      binding: app0
                      kind: histogram
                      attributes:
                          status: "200"
                          tenant: "acme"
                          user: "alice"
                      count: 1
                    - name: llm.active.requests
                      binding: app0
                      kind: gauge
                      attributes:
                          tenant: "acme"
                          user: "alice"
                      value: 0
                    - name: llm.interactions
                      binding: app0
                      kind: counter
                      attributes:
                          status: "200"
                          tenant: "acme"
                          user: "alice"
                      value: 1
                    - name: llm.time.to.first.token
                      binding: app0
                      kind: histogram
                      attributes:
                          tenant: "acme"
                          user: "alice"
                      count: 1
bindings:
    app0:
        type: test
        kind: proxy
        options:
            originType: llm
        routes:
            - exit: app1
        telemetry:
            attributes:
                user: ${guarded['test0'].identity}
                tenant: ${guarded['test0'].attributes.tenant}
                status: ${llm.status}
            metrics:
                - llm.*
