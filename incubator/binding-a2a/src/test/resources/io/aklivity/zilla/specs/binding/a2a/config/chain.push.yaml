---
name: test
vaults:
  secrets0:
    type: test
    options:
      wrap:
        - alias: a2a-push
          entry: |
            -----BEGIN SECRET KEY-----
            jOl3tg1ZDuqTrzB7WOVaUOEoezst8sz/ywPPbsGE8bA=
            -----END SECRET KEY-----
bindings:
  net0:
    type: a2a
    kind: server
    options:
      url: http://localhost:8080/a2a
      push:
        url: http://localhost:8080/a2a/push
        path: /a2a/push
    exit: app0
  app0:
    type: a2a
    kind: proxy
    options:
      push:
        url: http://localhost:8080/a2a/push
        vault: secrets0
        key: a2a-push
        ttl: PT24H
        allow:
          - https://*.example.com/hooks/*
          - https://*.example.com/webhook
        exit: app2
    routes:
      - when:
          - agent: weather
        exit: app1
  app1:
    type: a2a
    kind: client
    options:
      server: http://localhost:8080/a2a
    exit: net1
  app2:
    type: a2a
    kind: client
    options:
      push:
        allow:
          - https://*.example.com/hooks/*
    exit: net2
