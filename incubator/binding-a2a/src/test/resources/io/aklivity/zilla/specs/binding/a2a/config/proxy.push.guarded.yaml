---
name: test
guards:
  test0:
    type: test
    options:
      credentials: agent-cred-1
vaults:
  secrets0:
    type: test
    options:
      wrap:
        - alias: a2a-push
          entry: |
            -----BEGIN SECRET KEY-----
            jOl3tg1ZDuqTrzB7WOVaUOEoezst8sz/ywPPbsGE8bA=
            -----END SECRET KEY-----
bindings:
  app0:
    type: a2a
    kind: proxy
    options:
      push:
        url: http://localhost:8080/a2a/push
        vault: secrets0
        key: a2a-push
        ttl: PT24H
        maxLength: 2048
        allow:
          - https://*.example.com/hooks/*
          - https://*.example.com/webhook
        exit: app2
        authorization:
          test0: {}
    routes:
      - when:
          - agent: weather
        exit: app1
