---
name: test
embeddings:
  embedding0:
    type: test
stores:
  store0:
    type: test
catalogs:
  get_item_params:
    type: test
    options:
      id: 1
      schema: |
        {"type":"object","required":["id"],"properties":{"id":{"type":"integer"}}}
  get_item_result:
    type: test
    options:
      id: 2
      schema: |
        {"type":"object","properties":{"id":{"type":"integer"},"name":{"type":"string"}}}
  create_item_params:
    type: test
    options:
      id: 3
      schema: |
        {"type":"object","required":["name"],"properties":{"name":{"type":"string"},"price":{"type":"number"}}}
  search_items_params:
    type: test
    options:
      id: 4
      schema: |
        {"type":"object","required":["q"],"properties":{"q":{"type":"string"},"limit":{"type":"integer"}}}
  search_items_result:
    type: test
    options:
      id: 5
      schema: |
        {"type":"object","properties":{"items":{"type":"array","items":{"type":"string"}}}}
  watch_items_params:
    type: test
    options:
      id: 6
      schema: |
        {"type":"object","properties":{}}
bindings:
  app0:
    type: a2a-http
    kind: proxy
    options:
      embedding: embedding0
      threshold: 0.95
      skills:
        get_item:
          description: Look up an item by id
          examples: [ "get item 42" ]
          schemas:
            input:
              model: json
              catalog:
                get_item_params:
                  - subject: get_item_params
                    version: latest
    routes:
      - when:
          - skill: get_item
        exit: http0
        with:
          headers:
            ":method": GET
            ":scheme": https
            ":authority": api.example.internal:443
            ":path": "/items/${args.id}"
