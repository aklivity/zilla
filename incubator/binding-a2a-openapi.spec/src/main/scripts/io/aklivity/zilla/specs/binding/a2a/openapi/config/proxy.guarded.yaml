---
name: test
embeddings:
  embedding0:
    type: test
stores:
  store0:
    type: test
guards:
  test0:
    type: test
    options:
      roles:
        - code:write
catalogs:
  catalog0:
    type: test
    options:
      id: 1
      schema: |
        {
          "openapi": "3.1.0",
          "info": { "title": "GitHub", "version": "1.0.0", "description": "GitHub REST API" },
          "servers": [ { "url": "https://api.github.com" } ],
          "components": {
            "securitySchemes": { "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "jwt" } }
          },
          "paths": {
            "/orders/{orderId}": {
              "get": {
                "operationId": "read_order",
                "summary": "Read an order",
                "tags": [ "orders" ],
                "x-zilla-a2a": { "examples": [ "show me order 7" ] },
                "parameters": [ { "name": "orderId", "in": "path", "schema": { "type": "string" }, "required": true } ],
                "responses": {
                  "200": {
                    "description": "ok",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": { "id": { "type": "string" }, "status": { "type": "string" } }
                        }
                      }
                    }
                  }
                }
              }
            },
            "/search/code": {
              "get": {
                "operationId": "search_code",
                "summary": "Search for code",
                "tags": [ "search" ],
                "security": [ { "bearerAuth": [ "code:read" ] } ],
                "parameters": [ { "name": "q", "in": "query", "schema": { "type": "string" }, "required": true } ],
                "responses": {
                  "200": {
                    "description": "ok",
                    "content": {
                      "application/json": { "schema": { "type": "object", "properties": { "total": { "type": "integer" } } } }
                    }
                  }
                }
              }
            }
          }
        }
bindings:
  app0:
    type: a2a-openapi
    kind: proxy
    options:
      specs:
        github:
          catalog:
            catalog0:
              subject: github
              version: latest
          security:
            bearerAuth: test0
      embedding: embedding0
      store: store0
      threshold: 0.95
    routes:
      - with:
          spec: github
        exit: http0
