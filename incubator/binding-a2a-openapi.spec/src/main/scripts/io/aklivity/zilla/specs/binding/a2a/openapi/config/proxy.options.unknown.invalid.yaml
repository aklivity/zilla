---
name: test
embeddings:
  embedding0:
    type: test
stores:
  store0:
    type: test
catalogs:
  catalog0:
    type: test
    options:
      id: 1
      schema: |
        {
          "openapi": "3.1.0",
          "info": { "title": "GitHub", "version": "1.0.0", "description": "GitHub REST API" },
          "servers": [ { "url": "https://api.github.com" } ],
          "paths": {
            "/items": {
              "get": {
                "operationId": "search_items",
                "summary": "Search items",
                "tags": [ "items" ],
                "parameters": [
                  { "name": "q", "in": "query", "schema": { "type": "string" }, "required": true },
                  { "name": "limit", "in": "query", "schema": { "type": "integer" } }
                ],
                "responses": {
                  "200": {
                    "description": "ok",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": { "items": { "type": "array", "items": { "type": "string" } } }
                        }
                      }
                    }
                  }
                }
              }
            },
            "/orders/{orderId}": {
              "get": {
                "operationId": "read_order",
                "summary": "Read an order",
                "tags": [ "orders" ],
                "x-zilla-a2a": { "examples": [ "show me order 7" ] },
                "parameters": [ { "name": "orderId", "in": "path", "schema": { "type": "string" }, "required": true } ],
                "responses": {
                  "200": {
                    "description": "ok",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": { "id": { "type": "string" }, "status": { "type": "string" } }
                        }
                      }
                    }
                  }
                }
              }
            },
            "/repos/{owner}/{repo}/pulls": {
              "post": {
                "operationId": "create_pr",
                "summary": "Create a pull request",
                "tags": [ "pulls" ],
                "parameters": [
                  { "name": "owner", "in": "path", "schema": { "type": "string" }, "required": true },
                  { "name": "repo", "in": "path", "schema": { "type": "string" }, "required": true }
                ],
                "requestBody": {
                  "required": true,
                  "content": {
                    "application/json": {
                      "schema": {
                        "type": "object",
                        "required": [ "title", "head", "base" ],
                        "properties": {
                          "title": { "type": "string" },
                          "head": { "type": "string" },
                          "base": { "type": "string" },
                          "body": { "type": "string" }
                        }
                      }
                    }
                  }
                },
                "responses": {
                  "201": {
                    "description": "ok",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": {
                            "number": { "type": "integer" },
                            "html_url": { "type": "string" },
                            "state": { "type": "string" },
                            "title": { "type": "string" }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
bindings:
  app0:
    type: a2a-openapi
    kind: proxy
    options:
      specs:
        github:
          catalog:
            catalog0:
              subject: github
              version: latest
      embedding: embedding0
      store: store0
      threshold: 0.95
      unknown: true
    routes:
      - with:
          spec: github
        exit: http0
