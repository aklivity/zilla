---
name: test
telemetry:
    metrics:
        - http.request.size
        - http.response.size
        - http.active.requests
        - http.duration
    exporters:
        exporter0:
            type: test
            options:
                metrics:
                    - name: http.request.size
                      binding: app0
                      kind: histogram
                      count: 1
                      buckets:
                          - limit: 16
                            count: 1
                    - name: http.response.size
                      binding: app0
                      kind: histogram
                      count: 1
                      buckets:
                          - limit: 2
                            count: 1
                    - name: http.active.requests
                      binding: app0
                      kind: gauge
                      value: 0
                    - name: http.duration
                      binding: app0
                      kind: histogram
                      count: 1
bindings:
    app0:
        type: test
        kind: proxy
        options:
            originType: http
        routes:
            - exit: app1
        telemetry:
            metrics:
                - http.*
