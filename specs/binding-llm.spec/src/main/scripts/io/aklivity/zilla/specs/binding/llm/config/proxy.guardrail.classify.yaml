---
name: test
classifiers:
  secrets0:
    type: test
bindings:
  net0:
    type: llm
    kind: proxy
    options:
      guardrails:
        gpt-a:
          response:
            - section: assistant-text
              value:
                model: classify
                reject:
                  secrets0:
                    - secret.aws_key
            - section: tool-call
              value:
                model: classify
                reject:
                  secrets0:
                    - secret.aws_key
    routes:
    - when:
      - dialect: openai
        model: [ gpt-a ]
      exit: app0
