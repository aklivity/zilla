---
name: test
bindings:
  net0:
    type: llm
    kind: proxy
    options:
      guardrails:
        gpt-a:
          request:
            - section: user-text
              value:
                model: test
                reject:
                  - ignore previous instructions
            - section: user-image
              value:
                model: test
                reject:
                  - ignore previous instructions
            - section: user-document
              value:
                model: test
                reject:
                  - ignore previous instructions
            - section: user-audio
              value:
                model: test
                reject:
                  - ignore previous instructions
            - section: user-video
              value:
                model: test
                reject:
                  - ignore previous instructions
            - section: tool-definition
              value:
                model: test
                reject:
                  - not a tool definition
          response:
            - section: assistant-text
              value:
                model: test
                reject:
                  - ignore previous instructions
            - section: assistant-reasoning
              value:
                model: test
                reject:
                  - ignore previous instructions
            - section: tool-call
              value:
                model: test
                reject:
                  - '{"city":"ignore previous instructions"}'
        claude-a:
          request:
            - section: user-text
              value:
                model: test
                reject:
                  - ignore previous instructions
          response:
            - section: assistant-text
              value:
                model: test
                reject:
                  - ignore previous instructions
        gemini-a:
          request:
            - section: user-text
              value:
                model: test
                reject:
                  - ignore previous instructions
          response:
            - section: assistant-text
              value:
                model: test
                reject:
                  - ignore previous instructions
    routes:
    - when:
      - dialect: openai
        model: [ gpt-a ]
      exit: app0
    - when:
      - dialect: gemini
        model: [ gemini-a ]
      exit: app0
    - when:
      - dialect: anthropic
        model: [ claude-a ]
      exit: app0
