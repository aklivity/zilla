---
name: test
telemetry:
  exporters:
    exporter0:
      type: test
      options:
        events:
          - qname: engine:events
            id: engine.started
            name: ENGINE_STARTED
            message: Engine Started.
          - qname: test:app0
            id: binding.kafka.produce.staging.undersized
            name: BINDING_KAFKA_PRODUCE_STAGING_UNDERSIZED
            message: "Produce staging budget (512 bytes per worker) cannot hold one segment (700 bytes) for topic (test)."
          - qname: engine:events
            id: engine.stopped
            name: ENGINE_STOPPED
            message: Engine Stopped.
bindings:
    app0:
        type: kafka
        kind: cache_client
        exit: cache0
    cache0:
        type: kafka
        kind: cache_server
        exit: app1
