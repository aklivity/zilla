---
name: test
telemetry:
  exporters:
    exporter0:
      type: test
      options:
        events:
          - qname: engine:events
            id: engine.started
            name: ENGINE_STARTED
            message: Engine Started.
          - qname: test:app0
            id: binding.http.circuit.opened
            name: BINDING_HTTP_CIRCUIT_OPENED
            message: "Circuit 42 opened for 30000 ms after consecutive failures reached the threshold."
          - qname: test:app0
            id: binding.http.circuit.rejected
            name: BINDING_HTTP_CIRCUIT_REJECTED
            message: "Circuit 42 rejected a stream while open."
bindings:
  app0:
    type: http
    kind: client
    options:
      versions:
        - http/1.1
    routes:
      - exit: net0
        when:
          - headers:
              :authority: localhost:8080
