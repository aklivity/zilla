---
name: test
telemetry:
  exporters:
    exporter0:
      type: test
      options:
        events:
          - qname: engine:events
            id: engine.started
            name: ENGINE_STARTED
            message: Engine Started.
          - qname: test:net0
            id: guard.jwt.authorization.failed
            name: GUARD_JWT_AUTHORIZATION_FAILED
            message: JWT token authorization failed for identity (). Unable to unwrap content encryption key
vaults:
  vault0:
    type: test
    options:
      wrap:
        - alias: tenant-1
          entry: |
            -----BEGIN SECRET KEY-----
            jOl3tg1ZDuqTrzB7WOVaUOEoezst8sz/ywPPbsGE8bA=
            -----END SECRET KEY-----
        - alias: other
          entry: |
            -----BEGIN SECRET KEY-----
            Q2hhbmdlTWVDaGFuZ2VNZUNoYW5nZU1lQ2hhbmdlTWU=
            -----END SECRET KEY-----
