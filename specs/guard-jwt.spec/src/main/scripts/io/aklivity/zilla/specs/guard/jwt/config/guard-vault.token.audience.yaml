---
name: test
telemetry:
  exporters:
    exporter0:
      type: test
      options:
        events:
          - qname: engine:events
            id: engine.started
            name: ENGINE_STARTED
            message: Engine Started.
          - qname: test:net0
            id: guard.jwt.authorization.failed
            name: GUARD_JWT_AUTHORIZATION_FAILED
            message: JWT token authorization failed for identity (alice). Invalid issuer or audience.
vaults:
  vault0:
    type: test
    options:
      wrap:
        - alias: tenant-1
          entry: |
            -----BEGIN SECRET KEY-----
            jOl3tg1ZDuqTrzB7WOVaUOEoezst8sz/ywPPbsGE8bA=
            -----END SECRET KEY-----
        - alias: other
          entry: |
            -----BEGIN SECRET KEY-----
            Q2hhbmdlTWVDaGFuZ2VNZUNoYW5nZU1lQ2hhbmdlTWU=
            -----END SECRET KEY-----
guards:
  jwt0:
    type: jwt
    options:
      issuer: http://localhost:8080
      audience: https://api.aklivity.com
      keys: []
      vault: vault0
      secrets:
        - tenant-1
      attributes:
        site: website
