---
name: test
vaults:
    local-secrets:
        type: filesystem
        options:
            secrets:
                store: stores/secrets/secrets
                type: pkcs12
                password: generated
                entries:
                    app-key: app-key-alias
                    session-key:
                        active: "2"
                        versions:
                            "1": session-key-v1-alias
                            "2": session-key-v2-alias
                        algorithm: AES256_GCM
