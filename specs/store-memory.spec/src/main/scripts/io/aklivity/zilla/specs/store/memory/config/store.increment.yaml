---
name: test
stores:
    memory0:
        type: memory
bindings:
    net0:
        type: test
        kind: server
        options:
            store: memory0
            assertions:
                store:
                    memory0:
                        - op: increment
                          key: counter
                          delta: 5
                          ttl: PT1M
                          expect: 5
                        - op: increment
                          key: counter
                          delta: 3
                          expect: 8
                        - op: increment
                          key: counter
                          delta: -10
                          expect: -2
                        - op: get
                          key: counter
                          expect: "-2"
                        - op: increment
                          key: expiring
                          delta: 1
                          ttl: PT0.05S
                          expect: 1
                        - op: increment
                          key: expiring
                          delta: 1
                          ttl: PT1M
                          expect: 2
                        - op: get
                          key: expiring
                          delay: 150
                          expect: null
                        - op: increment
                          key: expiring
                          delta: 1
                          expect: 1
        routes:
            - exit: app0
