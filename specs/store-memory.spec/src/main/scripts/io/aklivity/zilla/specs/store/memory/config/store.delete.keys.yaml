---
name: test
stores:
    memory0:
        type: memory
bindings:
    net0:
        type: test
        kind: server
        options:
            store: memory0
            assertions:
                store:
                    memory0:
                        - op: put
                          key: a
                          value: "1"
                        - op: put
                          key: b
                          value: "2"
                        - op: delete
                          keys: [a, missing, b]
                          expect: 2
                        - op: get
                          keys: [a, b]
                          expect: [null, null]
                        - op: put
                          key: x
                          value: "1"
                          ttl: PT0.05S
                        - op: put
                          key: y
                          value: "2"
                        - op: delete
                          keys: [x, y]
                          delay: 150
                          expect: 1
        routes:
            - exit: app0
