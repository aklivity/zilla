---
name: test
stores:
    memory0:
        type: memory
bindings:
    net0:
        type: test
        kind: server
        options:
            store: memory0
            assertions:
                store:
                    memory0:
                        - op: expire
                          key: expire.
                          expect: tracked-value
                        - op: put
                          key: expire.sibling
                          value: tracked-value
                          ttl: PT2S
                        - op: increment
                          key: expire.counter
                          delta: 1
                          ttl: PT0.2S
                          expect: 1
                        - op: get
                          key: expire.counter
                          delay: 400
                          expect: null
        routes:
            - exit: app0
