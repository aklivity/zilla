---
name: test
guards:
    test0:
        type: test
        options:
            credentials: token
            identity: alice
            attributes:
                tenant: acme
telemetry:
    metrics:
        - model.fields.replaced
        - model.fields.declined
        - model.rejected.invalid
        - model.rejected.withheld
        - model.transform.duration
    exporters:
        exporter0:
            type: test
            options:
                metrics:
                    - name: model.transform.duration
                      binding: net1
                      kind: histogram
                      attributes:
                          tenant: "acme"
                          user: "alice"
                      count: 1
                    - name: model.rejected.invalid
                      binding: net1
                      kind: counter
                      attributes:
                          tenant: "acme"
                          user: "alice"
                      value: 0
bindings:
    net1:
        type: test
        kind: server
        exit: app1
        options:
            value:
                model: test
                reject:
                    - bad
        telemetry:
            attributes:
                user: ${guarded['test0'].identity}
                tenant: ${guarded['test0'].attributes.tenant}
            metrics:
                - model.*
