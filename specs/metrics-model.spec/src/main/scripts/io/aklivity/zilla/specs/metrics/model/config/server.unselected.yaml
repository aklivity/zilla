---
name: test
telemetry:
    metrics:
        - model.fields.replaced
        - model.fields.declined
        - model.rejected.invalid
        - model.rejected.withheld
        - model.transform.duration
    exporters:
        exporter0:
            type: test
            options:
                metrics:
                    - name: model.rejected.invalid
                      binding: net1
                      kind: counter
                      value: 0
                    - name: model.transform.duration
                      binding: net1
                      kind: histogram
                      count: 0
bindings:
    net1:
        type: test
        kind: server
        exit: app1
        options:
            value:
                model: test
                reject:
                    - bad
        telemetry:
            metrics:
                - model.rejected.withheld
