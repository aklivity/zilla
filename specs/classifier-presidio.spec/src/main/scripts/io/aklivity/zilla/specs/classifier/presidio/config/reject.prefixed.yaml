---
name: test
classifiers:
  presidio0:
    type: presidio
    options:
      endpoint: http://localhost:3000/presidio
      credentials:
        authorization: "Bearer test-key"
      language: en
      threshold: 0.6
      timeout: PT1S
      labels:
        person: PERSON
        email: EMAIL_ADDRESS
bindings:
  net0:
    type: test
    kind: server
    options:
      value:
        model: classify
        reject:
          presidio0:
            - person
            - email
    exit: app0
