---
name: test
telemetry:
    metrics:
        - stream.active.received
        - stream.active.sent
        - stream.opens.received
        - stream.opens.sent
        - stream.data.received
        - stream.data.sent
        - stream.errors.received
        - stream.errors.sent
        - stream.closes.received
        - stream.closes.sent
    exporters:
        exporter0:
            type: test
            options:
                metrics:
                    - name: stream.opens.received
                      binding: app0
                      kind: counter
                      value: 1
                    - name: stream.closes.received
                      binding: app0
                      kind: counter
                      value: 0
                    - name: stream.errors.received
                      binding: app0
                      kind: counter
                      value: 1
                    - name: stream.active.received
                      binding: app0
                      kind: gauge
                      value: 0
bindings:
    app0:
        type: test
        kind: proxy
        routes:
            - exit: app1
        telemetry:
            metrics:
                - stream.*
