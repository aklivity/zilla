---
name: test
catalogs:
  catalog0:
    type: test
    options:
      id: 1
      subject: sql
      schema: |
        syntax = "proto3";
        package example.sql.v1;
        service SQLService {
          rpc Query(QueryRequest) returns (QueryResult);
          rpc Execute(QueryRequest) returns (QueryResult);
          rpc Watch(QueryRequest) returns (stream QueryResult);
        }
        message QueryRequest { string statement = 1; }
        message QueryResult { string status = 1; }
bindings:
  app0:
    type: mcp-grpc
    kind: client
    options:
      server: http://localhost:8080
      tools:
        example_sql_v1_sql_service_query:
          title: Query SQL
          description: Run a read-only SQL query
          annotations:
            readOnlyHint: true
            idempotentHint: true
        example_sql_v1_sql_service_execute:
          title: Execute SQL
          annotations:
            destructiveHint: true
      catalog:
        catalog0:
          subject: sql
          version: latest
