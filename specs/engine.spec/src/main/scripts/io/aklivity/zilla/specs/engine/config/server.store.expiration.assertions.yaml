---
name: test
stores:
    store0:
        type: test
        options:
            assertions:
                - op: put
                  key: key0
                  value: value0
                  ttl: PT1M
                  expiration: untracked
                - op: putIfAbsent
                  key: key1
                  value: value1
                  ttl: PT1M
                  expiration: untracked
                - op: replace
                  key: key0
                  expected: value0
                  value: value2
                  ttl: PT1M
                  expiration: untracked
                - op: put
                  key: key3
                  value: value3
                  ttl: PT1M
                  expiration: tracked
                - op: put
                  key: key4
                  value: value4
                  ttl: PT1M
bindings:
    net0:
        type: test
        kind: server
        options:
            store: store0
            assertions:
                store:
                    store0:
                        - op: put
                          key: key0
                          value: value0
                          ttl: PT1M
                          expiration: untracked
                        - op: putIfAbsent
                          key: key1
                          value: value1
                          ttl: PT1M
                          expiration: untracked
                          expect: null
                        - op: replace
                          key: key0
                          expected: value0
                          value: value2
                          ttl: PT1M
                          expiration: untracked
                          expect: true
                        - op: put
                          key: key3
                          value: value3
                          ttl: PT1M
                          expiration: tracked
                        - op: put
                          key: key4
                          value: value4
                          ttl: PT1M
        routes:
            - exit: app0
