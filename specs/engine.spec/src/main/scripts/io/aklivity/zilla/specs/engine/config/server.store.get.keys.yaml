---
name: test
stores:
    store0:
        type: test
bindings:
    net0:
        type: test
        kind: server
        options:
            store: store0
            assertions:
                store:
                    store0:
                        - op: put
                          key: a
                          value: "1"
                        - op: put
                          key: c
                          value: "3"
                        - op: get
                          keys: [c, b, a]
                          expect: ["3", null, "1"]
                        - op: increment
                          key: e
                          delta: 5
                          ttl: PT0.05S
                          expect: 5
                        - op: get
                          keys: [e, a]
                          delay: 150
                          expect: [null, "1"]
        routes:
            - exit: app0
