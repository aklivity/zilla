---
name: test
telemetry:
    metrics:
        - test.counter
        - test.gauge
        - test.histogram
    exporters:
        test0:
            type: test
            options:
                metrics:
                    - name: test.counter
                      binding: net0
                      kind: counter
                      value: 42
                    - name: test.gauge
                      binding: test:net0
                      kind: gauge
                      value: 11
                    - name: test.histogram
                      binding: net0
                      kind: histogram
                      count: 1
                      buckets:
                          - limit: 32
                            count: 1
bindings:
    net0:
        type: test
        kind: server
        options:
            metrics:
                - name: test.counter
                  kind: counter
                  values:
                      - 42
                - name: test.gauge
                  kind: gauge
                  values:
                      - 11
                - name: test.histogram
                  kind: histogram
                  values:
                      - 17
        exit: app0
        telemetry:
            metrics:
                - test.*
