---
name: test
stores:
    store0:
        type: test
        options:
            assertions:
                - op: increment
                  key: counter
                  delta: 5
                  ttl: PT1M
                  value: "5"
                - op: increment
                  key: counter
                  delta: 3
                - op: put
                  key: key
                  value: old
                - op: replace
                  key: key
                  expected: old
                  value: new
                  ttl: PT1M
                - op: replace
                  key: key
                  expected: other
                  value: changed
                - op: delete
                  keys: [key, missing]
bindings:
    net0:
        type: test
        kind: server
        options:
            store: store0
            assertions:
                store:
                    store0:
                        - op: increment
                          key: counter
                          delta: 5
                          ttl: PT1M
                          expect: 5
                        - op: increment
                          key: counter
                          delta: 3
                          expect: 8
                        - op: put
                          key: key
                          value: old
                        - op: replace
                          key: key
                          expected: old
                          value: new
                          ttl: PT1M
                          expect: true
                        - op: replace
                          key: key
                          expected: other
                          value: changed
                          expect: false
                        - op: get
                          keys: [key, missing]
                          expect: [new, null]
                        - op: delete
                          keys: [key, missing]
                          expect: 1
        routes:
            - exit: app0
