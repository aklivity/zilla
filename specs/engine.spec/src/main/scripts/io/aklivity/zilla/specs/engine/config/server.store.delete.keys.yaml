---
name: test
stores:
    store0:
        type: test
bindings:
    net0:
        type: test
        kind: server
        options:
            store: store0
            assertions:
                store:
                    store0:
                        - op: put
                          key: a
                          value: "1"
                        - op: put
                          key: b
                          value: "2"
                        - op: delete
                          keys: [a, missing, b]
                          expect: 2
                        - op: get
                          keys: [a, b]
                          expect: [null, null]
                        - op: increment
                          key: x
                          delta: 1
                          ttl: PT0.05S
                          expect: 1
                        - op: put
                          key: y
                          value: "2"
                        - op: delete
                          keys: [x, y]
                          delay: 150
                          expect: 1
        routes:
            - exit: app0
