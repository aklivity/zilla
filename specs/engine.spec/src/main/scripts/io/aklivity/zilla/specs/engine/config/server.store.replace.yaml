---
name: test
stores:
    store0:
        type: test
bindings:
    net0:
        type: test
        kind: server
        options:
            store: store0
            assertions:
                store:
                    store0:
                        - op: put
                          key: key
                          value: old
                        - op: replace
                          key: key
                          expected: old
                          value: new
                          expect: true
                        - op: get
                          key: key
                          expect: new
                        - op: replace
                          key: key
                          expected: other
                          value: changed
                          expect: false
                        - op: get
                          key: key
                          expect: new
                        - op: replace
                          key: absent
                          expected: old
                          value: new
                          expect: false
                        - op: get
                          key: absent
                          expect: null
                        - op: put
                          key: ttl.key
                          value: old
                        - op: replace
                          key: ttl.key
                          expected: old
                          value: new
                          expect: true
                        - op: get
                          key: ttl.key
                          delay: 150
                          expect: new
                        - op: replace
                          key: ttl.key
                          expected: new
                          value: newer
                          ttl: PT0.05S
                          expect: true
                        - op: get
                          key: ttl.key
                          delay: 150
                          expect: null
                        - op: increment
                          key: expired.key
                          delta: 1
                          ttl: PT0.05S
                          expect: 1
                        - op: replace
                          key: expired.key
                          expected: "1"
                          value: new
                          delay: 150
                          expect: false
        routes:
            - exit: app0
