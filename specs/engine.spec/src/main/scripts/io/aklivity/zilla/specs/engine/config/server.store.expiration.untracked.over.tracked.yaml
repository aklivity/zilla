---
name: test
stores:
    store0:
        type: test
bindings:
    net0:
        type: test
        kind: server
        options:
            store: store0
            assertions:
                store:
                    store0:
                        - op: expire
                          key: expire.
                          expect: tracked-value
                        - op: put
                          key: expire.sibling
                          value: tracked-value
                          ttl: PT2S
                        - op: put
                          key: expire.key
                          value: tracked-value
                          ttl: PT10S
                        - op: put
                          key: expire.key
                          value: untracked-value
                          ttl: PT0.2S
                          expiration: untracked
                        - op: get
                          key: expire.key
                          delay: 400
                          expect: null
        routes:
            - exit: app0
