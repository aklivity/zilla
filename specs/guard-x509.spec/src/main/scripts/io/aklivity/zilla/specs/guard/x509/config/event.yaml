---
name: test
telemetry:
  exporters:
    exporter0:
      type: test
      options:
        events:
          - qname: engine:events
            id: engine.started
            name: ENGINE_STARTED
            message: Engine Started.
          - qname: test:net0
            id: guard.x509.authorization.failed
            name: GUARD_X509_AUTHORIZATION_FAILED
            message: X509 certificate chain authorization failed for identity (). Unable to parse certificate chain.
guards:
  x509_0:
    type: x509
bindings:
  net0:
    type: test
    kind: server
    options:
      authorization:
        x509_0:
          credentials: not-a-certificate-chain
    exit: app0
