---
name: test
guards:
  oauth:
    type: test
    options:
      acquire: deferred
      credentials: "deferred-token"
stores:
  memory0:
    type: test
    options:
      entries:
        tools: |-
          {"tools":[{"name": "get_weather","title": "Weather Information Provider","description": "Get current weather information for a location","inputSchema": {"type": "object","properties": {"location": {"type": "string","description": "City name or zip code"}},"required": ["location"]},"icons": [{"src": "https://example.com/weather-icon.png","mimeType": "image/png","sizes": ["48x48"]}],"execution": {"taskSupport": "optional"}},{"name": "echo_message","title": "Echo","description": "Echo a message back to the caller","inputSchema": {"type": "object","properties": {"message": {"type": "string","description": "Message to echo"}},"required": ["message"]}}]}
        resources: |-
          {"resources":[{"uri": "file:///docs/welcome.md","name": "welcome","description": "Welcome document","mimeType": "text/markdown"}]}
        resources/templates: |-
          {"resourceTemplates":[]}
        prompts: |-
          {"prompts":[{"name": "summarize","description": "Summarize a document"}]}
bindings:
  app0:
    type: mcp
    kind: proxy
    options:
      cache:
        store: memory0
        tools:
          eager:
            policy: explicit
            match:
              - echo_message
    exit: app1
  app1:
    type: mcp
    kind: client
    options:
      server: http://localhost:8080/mcp
      authorization:
        oauth:
          credentials: "Bearer {credentials}"
    exit: net0
